# Step 1 of "the forest with unusual properties" (design, Layer 6): the name alone.
# The region is a circle and a condition together, so the entry places no forest: it names what grew.
# The circle lies where forest grows in the default world (seed 20261004), on the preview and on the standard mesh.
# In another world, move it: an entry whose region holds no forest labels nothing, and the world store says so.
- id: whispering_forest
  physical: false
  reason: "The Whispering Forest"
  region:
    circle: {lat: -50.0, lon: 105.0, radius_km: 1500}
    where: {field: biome, is_one_of: [temperate_seasonal_forest, temperate_rainforest, boreal_forest]}
  pushes:
    - field: place_label
      set: whispering_forest
