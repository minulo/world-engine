# Sentence patterns for the "why" answers (design, Layer 7). Data, so that a game can rebuild the
# answers from the world store. Format: see src/worldengine/causes.py.
PlanetGeometry:
  latitude:
    says: "This cell lies at {lat}."
    ends: "The chain ends here: where a cell lies follows from the mesh alone."
  coriolis_parameter:
    says: "The Coriolis parameter is {value}: twice the planet's spin rate times the sine of the latitude, {lat}."
    ends: "The chain ends here, at a planet parameter: the rotation period of {planet[rotation_period_s]} seconds."

Tectonics:
  plate_id:
    says: "This cell rides on plate {value}."
    ends: "The chain ends here, at a seeded starting condition: the outlines and motions of the plates are drawn from the world seed."
  crust_type:
    says: "The crust here is {value}."
    ends: "The chain ends here, at a seeded starting condition: which crust each plate carries is drawn from the world seed."
  convergence_rate:
    says: "The nearest boundary of this cell's plate closes at {value} (a negative value means it opens)."
    ends: "The chain ends here, at a seeded starting condition: the motions of the plates are drawn from the world seed."
  ocean_crust_age:
    says: "The ocean floor here is {value} old: its distance from the plate's nearest spreading ridge, at half the opening speed there."
    says_missing: "There is no ocean floor here, so its age has no value: the crust is continental."
    follows: [convergence_rate]
    follows_missing: [crust_type]
  crust_thickness:
    says: "The crust here is {value} thick:"
    form: sum
    drivers:
      normal_thickness: {base: true, says: "crust of its type is normally {v} thick", follows: [crust_type]}
      seeded_variation: {says: "the seeded starting condition varies it by {v}"}
      thickened_by_plates: {says: "plates closing nearby have thickened it by {v}", follows: [convergence_rate]}
      event:
        row_of: tectonic_events
        values: {kind: {1: "a trench where one plate dives under the other", 2: "a collision of continents", 4: "a spreading ridge"}}
        says: "the event behind the thickening is {kind}, between plates {plate_a} and {plate_b} (row {row} of the table of tectonic events)"

Isostasy:
  elevation:
    says: "The solid surface stands at {value} relative to the reference level:"
    form: sum
    drivers:
      from_crust_thickness: {says: "continental crust floating on denser rock gives {v}", follows: [crust_thickness]}
      from_ocean_floor_age: {says: "the age of the ocean floor gives {v}", follows: [ocean_crust_age]}

SeaLevel:
  ocean_mask:
    says: "Under water here: {value}."
    follows: [elevation]
    drivers:
      reason:
        names: ["the ground stands above sea level", "it was flooded from the main sea", "it lies in a separate body of water",
                "it is low ground that a barrier keeps dry",
                "it is low ground in a hollow that the sea spilled into, and the water ran out before the hollow filled"]
        says: "The reason: {v}"
      barrier_cell: {cell: true}
  height_above_sea:
    says: "This cell lies {value} above sea level:"
    form: sum
    drivers:
      ground_height: {says: "its surface stands at {v} relative to the reference level", follows: [elevation]}
      sea_level: {says: "the sea level, found by pouring the planet's water in, shifts that by {v}", always: true}

Drainage:
  flow_receiver:
    says: "Water on the ground here runs to cell {value} (-1: to no cell)."
    follows: [elevation]
    drivers:
      rule:
        names: ["That is its lowest neighbour", "The cell is sea, where the routing of water over land ends",
                "No neighbour is lower: this is the bottom of a closed hollow",
                "The ground is level here, and that cell lies on the shortest way to lower ground or to the hollow's bottom"]
        says: "{v}"
  slope:
    says: "Toward the cell its water runs to, the ground here falls by {value} for every metre of distance."
    unit: ""
    follows: [flow_receiver]
  drainage_area:
    says: "{value} of land send their water through this cell when every hollow upstream is full and overflows: its own area, plus that of every cell whose water runs through it."
    unit: km2_from_m2
    follows: [flow_receiver]
  basin_id:
    says: "With every hollow on the way full, the water from here leaves the land at cell {value}, the mouth of its river basin (-1: the cell is sea)."
    follows: [flow_receiver]
    drivers:
      ends:
        names: ["", "From there the water runs into the sea (where a hollow overflows straight into the sea, the cell named is the deepest of that hollow)",
                "This land has no way out to any sea: the cell named is the deepest bottom of the hollow that holds it"]
        says: "{v}"
  depression_id:
    says: "Water from here collects in hollow {value} of the table of hollows before it can go further (0: it runs to the sea without meeting a closed hollow)."
    follows: [flow_receiver]
    drivers:
      hollow:
        row_of: hollows
        says: "The bottom of that hollow is cell {bottom_cell}, at {bottom_m} m; it overflows when its water stands at {spill_m} m, toward cell {spill_into_cell}"
  spill_elevation:
    says: "The hollow this cell drains into overflows when its water stands at {value} relative to the reference level."
    says_missing: "Water from here reaches the sea without meeting a closed hollow, so there is no level of overflow to give."
    follows: [depression_id]
    follows_missing: [depression_id]

Insolation:
  insolation:
    says: "Sunlight at the top of the air averages {value} over the year here."
    ends: "The chain ends here, at planet parameters: the latitude of {lat}, the axial tilt of {planet[axial_tilt_deg]} degrees and the star output of {planet[star_output_w_m2]} W/m²."

Albedo:
  albedo:
    says: "Over the year, {value} of the sunlight is reflected here:"
    form: sum
    unit: ""
    drivers:
      from_cloud_and_sun_angle: {says: "cloud and the low sun reflect {v}"}
      from_surface_type: {says: "the surface type reflects {v}", follows: [ocean_mask]}
      from_snow_and_ice: {says: "snow and ice add {v}", follows: [snow_water, surface_temperature]}

EnergyBalance:
  surface_temperature:
    says: "The temperature here averages {value} over the year:"
    form: sum
    unit: C_from_K
    drivers:
      sunlight_against_heat_loss: {unit: C_from_K, says: "sunlight absorbed against heat lost to space would give {v}", follows: [insolation, albedo]}
      spread_from_neighbours: {unit: K_difference, says: "heat spread from neighbouring cells changes it by {v}"}
      seasonal_storage: {unit: K_difference, says: "heat stored and released through the year changes it by {v}"}
      other_heat: {unit: K_difference, says: "other heat delivered to the surface changes it by {v}", group: surface_heat_flux}
      cooling_from_height: {unit: K_difference, says: "its height changes it by {v}", follows: [height_above_sea]}

Circulation:
  sea_level_pressure:
    says: "The pressure at sea level averages {value} here:"
    form: sum
    drivers:
      mean_pressure: {base: true, says: "the planet's mean pressure is {v}"}
      belt_part: {says: "the pressure belts of the overturning loop and the storm zone add {v}", follows: [subsidence]}
      warm_or_cold_surface_part: {says: "a surface warmer or colder than its latitude adds {v}", follows: [surface_temperature]}
  wind:
    says: "The wind here averages {value} over the year:"
    form: sum
    drivers:
      from_belts: {says: "the pressure belts drive {v} of it", follows: [sea_level_pressure]}
      from_surface_temperature: {says: "warm and cold surfaces drive {v} of it", follows: [surface_temperature]}
  subsidence:
    says: "Air here sinks at {value} on average (a negative value means it rises)."
    follows: [surface_temperature]
    drivers:
      branch:
        names: ["It lies under no branch of the tropical overturning loop", "It lies under the rising branch of the tropical overturning loop",
                "It lies under the sinking branch of the northern loop", "It lies under the sinking branch of the southern loop"]
        says: "{v}"

Moisture:
  precipitation:
    says: "Precipitation here averages {value}:"
    form: sum
    drivers:
      from_moist_air: {says: "moist air rains {v}", follows: [wind], at: vapour_came_from}
      from_rising_ground: {says: "air forced up rising ground adds {v}", follows: [height_above_sea]}
      stopped_by_sinking_air: {says: "sinking air changes it by {v}", follows: [subsidence]}
      vapour_came_from: {cell: true}
  snowfall:
    says: "Snowfall here averages {value}."
    follows: [precipitation, surface_temperature]
  column_water:
    says: "The air column here holds {value} of water vapour on average."
    follows: [wind, surface_temperature]

Hydrology:
  snow_water:
    says: "The snow on the ground here holds {value} of water on the year's average: what has fallen as snow and not yet melted."
    follows: [snowfall, surface_temperature]
  potential_evapotranspiration:
    says: "The air here could take up {value} of water if the ground were wet (the Priestley-Taylor rule)."
    says_missing: "This cell is sea: the demand of the air for water is worked out for land only."
    follows: [insolation, surface_temperature]
    follows_missing: [ocean_mask]
    drivers:
      net_radiation: {unit: "W/m²", says: "The surface gains {v} from radiation on the year's average, sunlight absorbed less heat radiated away"}
  soil_moisture:
    says: "The soil here holds {value} of what it can hold, on the year's average: rain and melted snow fill it, and the air takes water from it."
    unit: ""
    says_missing: "This cell is sea: it has no soil."
    follows: [precipitation, potential_evapotranspiration]
    follows_missing: [ocean_mask]
  evapotranspiration:
    says: "The land here returns {value} of water to the air:"
    says_zero: "No water goes back to the air from land here: the cell is sea, or its ground lies under snow or has no water to give."
    follows_zero: [ocean_mask, snow_water]
    form: sum
    drivers:
      from_soil_and_plants: {says: "the soil gives {v}", follows: [soil_moisture, potential_evapotranspiration]}
      from_lake: {says: "open water of a lake gives {v}", follows: [lake_fraction]}
  runoff:
    says: "Runoff here averages {value}:"
    says_zero: "No water runs off here: the soil holds all that falls until the air has taken it, or a lake covers the cell, or the cell is sea."
    follows_zero: [soil_moisture, lake_fraction]
    form: sum
    drivers:
      from_rain: {says: "rain that the soil could not hold gives {v}", follows: [precipitation, soil_moisture]}
      from_snowmelt: {says: "melted snow that the soil could not hold gives {v}", follows: [snow_water]}
      from_ice: {says: "ice leaving ground where snow never melts away gives {v}", follows: [snow_water]}
  runoff_annual:
    says: "The runoff of the whole year here is {value}."
    follows: [runoff]
  river_discharge:
    says: "The river here carries {value} on the year's average:"
    says_zero: "No river runs through this cell: no water runs off it, and none reaches it from higher ground."
    follows_zero: [runoff]
    form: sum
    drivers:
      local_runoff: {says: "the cell's own runoff gives {v}", follows: [runoff]}
      from_upstream: {says: "{v} arrive from upstream, and the cell named next is the largest single source of it", follows: [runoff], at: largest_source}
      largest_source: {cell: true}
  lake_fraction:
    says: "A lake covers {value} of this cell."
    unit: ""
    follows: [depression_id]
    drivers:
      state:
        names: ["No lake reaches it", "It is a lake with an outlet: more water arrives than its surface can lose to the air, so it has filled to its pass and overflows",
                "It is a closed lake: it has spread until its surface loses to the air all the water that arrives, and stands below its pass"]
        says: "{v}"
        follows_by:
          "It is a lake with an outlet: more water arrives than its surface can lose to the air, so it has filled to its pass and overflows": [river_discharge]
          "It is a closed lake: it has spread until its surface loses to the air all the water that arrives, and stands below its pass": [potential_evapotranspiration]
      lake:
        row_of: lakes
        says: "Each year {inflow_m3_per_year} m³ of water run toward this lake; flooding its {area_m2} m² lets the air take {loss_to_air_m3_per_year} m³ more than the same ground would give dry, and {outflow_m3_per_year} m³ leave over the pass (row {row} of the table of lakes)"
  lake_level:
    says: "The surface of the lake here stands at {value} relative to the reference level."
    says_missing: "No lake reaches this cell, so there is no lake level to give."
    follows: [lake_fraction]
    follows_missing: [lake_fraction]

Soils:
  soil_water_capacity:
    says: "The soil here can hold {value} of water."
    ends: "The chain ends here, at a model constant: until the Soils process of build step 7, every soil is given the capacity of Manabe's bucket."

Biomes:
  biome:
    says: "The biome here is {value}:"
    drivers:
      rule:
        names: ["the cell is sea", "the warmest month is below freezing, so nothing grows", "Whittaker's chart places this climate here",
                "the climate lies off Whittaker's chart, and this is the nearest biome on it",
                "ice lies on the sea here: the mean temperature of the year is below -10 °C"]
        says: "{v}"
        follows_by:
          "the cell is sea": [ocean_mask]
          "ice lies on the sea here: the mean temperature of the year is below -10 °C": [surface_temperature, ocean_mask]
          "the warmest month is below freezing, so nothing grows": [surface_temperature]
      # on sea the two yearly values are missing, and a missing value is not mentioned
      yearly_temperature: {unit: C_from_K, says: "the yearly mean temperature is {v}"}
      yearly_precipitation: {unit: mm, says: "the yearly precipitation is {v}"}
      limit:
        names: [none, too_cold, too_dry, not_land]
        says_by:
          too_cold: "what limits plant life here is cold"
          too_dry: "what limits plant life here is drought"
          none: "neither cold nor drought limits plant life here"
        follows_by:
          too_cold: [surface_temperature]
          too_dry: [precipitation]
          none: [precipitation, surface_temperature]
  climate_class:
    says: "The Köppen-Geiger climate class here is {value}:"
    follows: [surface_temperature, precipitation]
    drivers:
      group:
        names: ["the cell is sea", "it is an arid climate: the year's precipitation is below ten times the dryness threshold",
                "it is a tropical climate: the coldest month is 18 °C or warmer", "it is a temperate climate",
                "it is a cold climate: the coldest month is at or below 0 °C", "it is a polar climate: the warmest month is 10 °C or colder"]
        says: "{v}"
