# Sentence patterns for the "why" answers (design, Layer 7). Data, so that a game can rebuild the
# answers from the world store. Format: see src/worldengine/causes.py.
PlanetGeometry:
  latitude:
    says: "This cell lies at {lat}."
    ends: "The chain ends here: where a cell lies follows from the mesh alone."
  coriolis_parameter:
    says: "The Coriolis parameter is {value}: twice the planet's spin rate times the sine of the latitude, {lat}."
    ends: "The chain ends here, at a planet parameter: the rotation period of {planet[rotation_period_s]} seconds."

Tectonics:
  plate_id:
    says: "This cell rides on plate {value}."
    ends: "The chain ends here, at the history of the plates: their seeded start, and the splits and welds of the table of tectonic events."
  crust_type:
    says: "The crust here is {value}."
    ends: "The chain ends here, at a seeded starting condition: which crust each plate carries is drawn from the world seed."
  convergence_rate:
    says: "The nearest boundary of this cell's plate closes at {value} (a negative value means it opens)."
    ends: "The chain ends here, at the motions of the plates: drawn from the world seed at the start, then turned by slab pull and set anew where a plate split (the table of plates and the table of tectonic events)."
  ocean_crust_age:
    says: "The ocean floor here is {value} old: it formed at a spreading ridge and has ridden with its plate since (floor of the seeded start was given the age of its distance from the nearest ridge, at half the opening speed there)."
    says_missing: "There is no ocean floor here, so its age has no value: the crust is continental."
    follows: [convergence_rate]
    follows_missing: [crust_type]
  crust_thickness:
    says: "The crust here is {value} thick:"
    form: sum
    drivers:
      formed_thickness: {base: true, says: "it formed {v} thick, at the seeded start or at a spreading ridge", follows: [crust_type]}
      thickened_by_plates: {says: "plates closing nearby have since thickened it by {v}", follows: [convergence_rate]}
      removed_by_erosion:
        says: "erosion has since changed it by {v}"
        ends: "The chain ends here, at the history of erosion: what rivers and hillside creep wore away in each round, a round's wear set by the slope, the water and the rock of that time (FluvialErosion)."
      event:
        row_of: tectonic_events
        values: {kind: {1: "a trench where one plate dives under the other", 2: "a collision of continents", 3: "the split of a plate", 4: "a spreading ridge"}}
        says: "the last event that thickened it is {kind}, between plates {plate_a} and {plate_b}, {time_my} My into the history (row {row} of the table of tectonic events)"

Isostasy:
  elevation:
    says: "The solid surface stands at {value} relative to the reference level:"
    form: sum
    drivers:
      from_crust_thickness: {says: "continental crust floating on denser rock gives {v}", follows: [crust_thickness]}
      from_ocean_floor_age: {says: "the age of the ocean floor gives {v}", follows: [ocean_crust_age]}

Lithology:
  rock_type:
    says: "The rock at the surface here is {value}, from the tectonic setting (the rule table of Lithology):"
    follows: [crust_type, orogeny_age, volcanism]
  erodibility:
    says: "Running water wears this rock at {value} times the rate of an average rock."
    follows: [rock_type]

FluvialErosion:
  erosion_rate:
    says: "Rock is worn away here at {value}:"
    form: sum
    drivers:
      rivers: {says: "rivers cutting down toward the sea take {v}", follows: [elevation]}
      creep: {says: "hillsides creeping downhill take {v}"}

SeaLevel:
  ocean_mask:
    says: "Under water here: {value}."
    follows: [elevation]
    drivers:
      reason:
        names: ["the ground stands above sea level", "it was flooded from the main sea", "it lies in a separate body of water",
                "it is low ground that a barrier keeps dry",
                "it is low ground in a hollow that the sea spilled into, and the water ran out before the hollow filled"]
        says: "The reason: {v}"
      barrier_cell: {cell: true}
  height_above_sea:
    says: "This cell lies {value} above sea level:"
    form: sum
    drivers:
      ground_height: {says: "its surface stands at {v} relative to the reference level", follows: [elevation]}
      sea_level: {says: "the sea level, found by pouring the planet's water in, shifts that by {v}", always: true}

Drainage:
  flow_receiver:
    says: "Water on the ground here runs to cell {value} (-1: to no cell)."
    follows: [elevation]
    drivers:
      rule:
        names: ["That is its lowest neighbour", "The cell is sea, where the routing of water over land ends",
                "No neighbour is lower: this is the bottom of a closed hollow",
                "The ground is level here, and that cell lies on the shortest way to lower ground or to the hollow's bottom"]
        says: "{v}"
  slope:
    says: "Toward the cell its water runs to, the ground here falls by {value} for every metre of distance."
    unit: ""
    follows: [flow_receiver]
  drainage_area:
    says: "{value} of land send their water through this cell when every hollow is full and overflows: its own area, plus that of every cell whose water runs through it."
    unit: km2_from_m2
    follows: [flow_receiver]
    drivers:
      cell_is: {names: [open_ground, under_a_full_hollow, sea]}
    cases:
      - when: {cell_is: sea}
        says: "This cell is sea. {value} of land drain straight into it when every hollow is full and overflows; its own area is not counted."
        follows: [ocean_mask]
      - when: {cell_is: under_a_full_hollow}
        says: "{value} of land send their water through this cell when every hollow is full and overflows. The cell lies in a closed hollow, at or below the level of its pass: when the hollow is full, its water is handed from cell to cell, by the shortest way, to the hollow's outlet cell. This cell counts its own area and that of every cell whose water passes it on that way."
        follows: [depression_id]
  basin_id:
    says: "With every hollow on the way full, the water from here leaves the land at cell {value}, the mouth of its river basin. Whether those hollows do fill depends on the climate: lake_fraction says what Hydrology found."
    follows: [flow_receiver]
    drivers:
      ends:
        names: [sea, reaches_the_sea, no_way_out]
        says_by:
          reaches_the_sea: "From that cell the water runs into the sea"
          no_way_out: "This land has no way out to any sea: the cell named is the deepest bottom of the hollow that holds it"
    cases:
      - when: {ends: sea}
        says: "This cell is sea: it belongs to no river basin, which the number -1 stands for."
        follows: [ocean_mask]
        quiet: true
  depression_id:
    says: "Water from here collects first in hollow {value} of the table of hollows, the innermost closed hollow around this cell (0: it runs to the sea without meeting a closed hollow)."
    follows: [flow_receiver]
    drivers:
      hollow:
        row_of: hollows
        says: "The bottom of that hollow is cell {bottom_cell}, at {bottom_m} m; taken by itself it overflows when its water stands at {spill_m} m, toward cell {spill_into_cell}. It may lie inside a larger hollow, and a lake that fills the larger one stands higher than that: lake_fraction says what Hydrology found"
  spill_elevation:
    says: "The hollow this cell drains into overflows when its water stands at {value} relative to the reference level."
    says_missing: "Water from here reaches the sea without meeting a closed hollow, so there is no level of overflow to give."
    follows: [depression_id]
    follows_missing: [depression_id]

Insolation:
  insolation:
    says: "Sunlight at the top of the air averages {value} over the year here."
    ends: "The chain ends here, at planet parameters: the latitude of {lat}, the axial tilt of {planet[axial_tilt_deg]} degrees and the star output of {planet[star_output_w_m2]} W/m²."

Albedo:
  albedo:
    says: "Over the year, {value} of the sunlight is reflected here:"
    form: sum
    unit: ""
    drivers:
      from_cloud_and_sun_angle: {says: "cloud and the low sun reflect {v}"}
      from_surface_type: {says: "the surface type reflects {v}", follows: [ocean_mask]}
      from_snow_and_ice: {says: "snow and ice add {v}", follows: [snow_cover, surface_temperature]}

EnergyBalance:
  surface_temperature:
    says: "The temperature here averages {value} over the year:"
    form: sum
    unit: C_from_K
    drivers:
      sunlight_against_heat_loss: {unit: C_from_K, says: "sunlight absorbed against heat lost to space would give {v}", follows: [insolation, albedo]}
      spread_from_neighbours: {unit: K_difference, says: "heat spread from neighbouring cells changes it by {v}"}
      seasonal_storage: {unit: K_difference, says: "heat stored and released through the year changes it by {v}"}
      other_heat: {unit: K_difference, says: "other heat delivered to the surface changes it by {v}", group: surface_heat_flux}
      cooling_from_height: {unit: K_difference, says: "its height changes it by {v}", follows: [height_above_sea]}

Circulation:
  sea_level_pressure:
    says: "The pressure at sea level averages {value} here:"
    form: sum
    drivers:
      mean_pressure: {base: true, says: "the planet's mean pressure is {v}"}
      belt_part: {says: "the pressure belts of the overturning loop and the storm zone add {v}", follows: [subsidence]}
      warm_or_cold_surface_part: {says: "a surface warmer or colder than its latitude adds {v}", follows: [surface_temperature]}
  wind:
    says: "The wind here averages {value} over the year:"
    form: sum
    drivers:
      from_belts: {says: "the pressure belts drive {v} of it", follows: [sea_level_pressure]}
      from_surface_temperature: {says: "warm and cold surfaces drive {v} of it", follows: [surface_temperature]}
  subsidence:
    says: "Air here sinks at {value} on average (a negative value means it rises)."
    follows: [surface_temperature]
    drivers:
      branch:
        names: ["It lies under no branch of the tropical overturning loop", "It lies under the rising branch of the tropical overturning loop",
                "It lies under the sinking branch of the northern loop", "It lies under the sinking branch of the southern loop"]
        says: "{v}"

Moisture:
  precipitation:
    says: "Precipitation here averages {value}:"
    form: sum
    drivers:
      from_moist_air: {says: "moist air rains {v}", follows: [wind], at: vapour_came_from}
      from_rising_ground: {says: "air forced up rising ground adds {v}", follows: [height_above_sea]}
      stopped_by_sinking_air: {says: "sinking air changes it by {v}", follows: [subsidence]}
      vapour_came_from: {cell: true}
  snowfall:
    says: "Snowfall here averages {value}."
    follows: [precipitation, surface_temperature]
  column_water:
    says: "The air column here holds {value} of water vapour on average."
    follows: [wind, surface_temperature]

Hydrology:
  snow_water:
    says: "The snow on the ground here holds {value} of water on the year's average. It builds up in the cold months and is gone by the end of the warm ones: of the {fell} that fall as snow on the year's average, all melt."
    quiet: true
    follows: [snowfall, surface_temperature]
    drivers:
      state: {names: [no_snow, part_of_the_year, all_year, sea]}
      fell: {unit: mm/month}
      melted: {unit: mm/month}
      left_as_ice: {unit: mm/month}
    cases:
      - when: {state: sea}
        says: "This cell is sea: snow that falls here falls into water, and no store of snow is kept."
        follows: [ocean_mask]
      - when: {state: no_snow}
        says: "No snow lies on the ground here in any month: none falls, or what falls melts within its month."
      - when: {state: all_year}
        says: "The snow on the ground here holds {value} of water on the year's average, and lies all year: more snow falls in a year than the year can melt. Of the {fell} that fall on the year's average, {melted} melt and {left_as_ice} leave as ice. The store is held to a set number of years of the net snowfall, a model constant; what is older is the ice that leaves."
  snow_cover:
    says: "Snow covers {value} of the ground here on the year's average: the ground counts as fully covered while the store holds a set depth of water, and each month is counted by the days the snow lay."
    unit: percent_from_share
    follows: [snow_water]
    drivers:
      state: {names: [no_snow, part_of_the_year, all_year, sea]}
    cases:
      - when: {state: sea}
        says: "This cell is sea: no snow lies on it. Ice on the sea is not part of this field."
        follows: [ocean_mask]
      - when: {state: no_snow}
        says: "No snow lies on the ground here in any month."
        follows: [snow_water]
  potential_evapotranspiration:
    says: "The air here could take {value} of water from the ground if the ground were wet (the Priestley-Taylor rule). The ground gains {net_radiation} from radiation on the year's average, sunlight absorbed less heat radiated away, and no snow covers it in any month."
    says_missing: "This cell is sea: the demand of the air for water is worked out for land only."
    quiet: true
    follows: [insolation, surface_temperature]
    follows_missing: [ocean_mask]
    drivers:
      state: {names: [no_snow, part_of_the_year, all_year, sea]}
      net_radiation: {unit: "W/m²"}
      snow_free: {unit: percent_from_share}
    cases:
      - when: {state: part_of_the_year}
        says: "The air here could take {value} of water from the ground if the ground were wet (the Priestley-Taylor rule). Bare ground here would gain {net_radiation} from radiation on the year's average, sunlight absorbed less heat radiated away. But snow covers some of the ground for some or all of the year, and from under snow the air takes nothing in this model: counted over the year, {snow_free} of the ground is bare."
        follows: [snow_water, insolation, surface_temperature]
      - when: {state: all_year}
        says: "The air takes no water from the ground here: snow covers it through every month, and from under snow the air takes nothing in this model."
        follows: [snow_water]
  soil_moisture:
    says: "The soil here holds {value} of what it can hold, on the year's average: rain and melted snow fill it, and the air takes water from it."
    unit: ""
    says_missing: "The soil of this cell can hold no water, so there is no share to give."
    follows: [precipitation, potential_evapotranspiration]
    follows_missing: [soil_water_capacity]
    drivers:
      cover: {names: [dry_land, partly_under_a_lake, under_a_lake, sea]}
    cases:
      - when: {cover: sea}
        says_missing: "This cell is sea: it has no soil."
        follows_missing: [ocean_mask]
      - when: {cover: under_a_lake}
        says: "This cell lies under a lake, so its ground counts as full of water: {value} of what it can hold."
        follows: [lake_fraction]
      - when: {cover: partly_under_a_lake}
        says: "The ground of this cell holds {value} of the water it can hold, on the year's average. Part of the cell lies under a lake, and that part counts as full; in the rest, rain and melted snow fill the soil and the air takes water from it."
        follows: [lake_fraction, precipitation, potential_evapotranspiration]
  evapotranspiration:
    says: "The land here returns {value} of water to the air:"
    says_zero: "No water goes back to the air from the ground here: snow covers the ground whenever the air could take water, or no water reaches the soil."
    follows_zero: [snow_water, soil_moisture]
    form: sum
    drivers:
      from_soil_and_plants: {says: "the soil gives {v}", follows: [soil_moisture, potential_evapotranspiration]}
      from_lake: {says: "open water of a lake gives {v}", follows: [lake_fraction]}
      cover: {names: [dry_land, partly_under_a_lake, under_a_lake, sea]}
    cases:
      - when: {cover: sea}
        says: "This cell is sea. What the sea gives the air is the field ocean_evaporation; this field holds what land gives, which is nothing here."
        quiet: true
        follows: [ocean_mask]
  runoff:
    says: "Runoff here averages {value}:"
    says_zero: "No water runs off here: the soil holds all that falls until the air has taken it."
    follows_zero: [soil_moisture]
    form: sum
    drivers:
      from_rain: {says: "rain that the soil could not hold gives {v}", follows: [precipitation, soil_moisture]}
      from_snowmelt: {says: "melted snow that the soil could not hold gives {v}", follows: [snow_water]}
      from_ice: {says: "ice leaving ground where snow never melts away gives {v}", follows: [snow_water]}
      cover: {names: [dry_land, partly_under_a_lake, under_a_lake, sea]}
      shed_as_if_dry: {aside: true, unit: mm/month}
    cases:
      - when: {cover: sea}
        says: "This cell is sea: runoff is water leaving the ground, and there is no ground here."
        quiet: true
        follows: [ocean_mask]
      - when: {cover: under_a_lake}
        says: "No runoff is counted in this field here: the cell lies wholly under a lake, and what falls on it falls into the lake. In the books of the rivers the cell still counts with the {shed_as_if_dry} that its ground would shed if it were dry; what the open water loses to the air beyond that is taken off at the lake."
        quiet: true
        follows: [lake_fraction]
      - when: {cover: partly_under_a_lake}
        says: "Runoff here averages {value}, counted over the whole cell for the part of it that no lake covers:"
        says_zero: "No water runs off the part of this cell that no lake covers: its soil holds all that falls until the air has taken it."
  runoff_annual:
    says: "The runoff of the whole year here is {value}."
    follows: [runoff]
  river_discharge:
    says: "The river here carries {value} on the year's average:"
    says_zero: "No river runs through this cell: no water runs off it, and none reaches it from higher ground."
    follows_zero: [runoff]
    form: sum
    drivers:
      local_runoff: {says: "the cell's own runoff gives {v}", follows: [runoff]}
      from_upstream: {says: "{v} arrive from upstream, where the largest single source is {at}", follows: [runoff], at: largest_source}
      into_the_lake: {says: "the flooded part of the cell takes of that water what reaches the lake here, which changes it by {v}", follows: [lake_fraction]}
      through_lake: {says: "{v} cross the lake here"}
      largest_source: {cell: true}
      place: {names: [dry_ground, lake_that_overflows, closed_lake, sea, brim_of_a_lake_that_overflows, under_a_closed_lake]}
      lake: {row_of: lakes}
    cases:
      - when: {place: sea}
        says: "This cell is sea. The rivers that end here deliver {value} on the year's average:"
        says_zero: "This cell is sea, and no river ends in it."
        follows_zero: [ocean_mask]
      - when: {place: lake_that_overflows}
        says: "This cell lies in a lake that overflows. Of the water that crosses the lake here on its way to the outlet, {value} go on to leave the lake over its pass, on the year's average: every month the lake passes on the share of what reaches it that it does not lose to the air over the year."
        quiet: true
        follows: [lake_fraction]
      - when: {place: brim_of_a_lake_that_overflows}
        says: "This cell stands at the brim of a lake that overflows: exactly at the level of its water, so that the lake covers none of it, and on the way that water takes to the pass. Of the water that crosses here, the cell's own runoff with it, {value} go on to leave the lake over its pass, on the year's average: every month the lake passes on the share of what reaches it that it does not lose to the air over the year."
        quiet: true
        follows: [lake_fraction]
      - when: {place: closed_lake}
        says: "This cell lies partly under a closed lake, which keeps all the water that reaches it. The river is counted over the part of the cell that is not flooded, which gives {value} on the year's average:"
        says_zero: "This cell lies partly under a closed lake, which keeps all the water that reaches it. No water runs off the rest of the cell, and none reaches it from higher ground."
        follows_zero: [lake_fraction]
      - when: {place: under_a_closed_lake}
        says: "This cell lies wholly under a closed lake, which keeps all the water that reaches it: no river is counted here. The rivers of the cells that drain into this one bring the lake {from_upstream} here on the year's average; water that entered the lake further up is not counted again."
        quiet: true
        follows: [lake_fraction]
  lake_fraction:
    says: "A lake covers {value} of this cell."
    unit: percent_from_share
    follows: [depression_id]
    drivers:
      state:
        names: [none, with_outlet, closed, no_way_out, at_its_brim]
        says_by:
          none: "No lake reaches it"
          with_outlet: "It is a lake with an outlet: more water arrives than its surface can lose to the air, so it has filled to its pass and overflows"
          closed: "It is a closed lake: it has spread until its surface loses to the air all the water that arrives, and stands below its pass"
          no_way_out: "It is a lake in a hollow with no way out, flooded to its rim: more water arrives than its whole surface can lose to the air, and the model drops the rest"
          at_its_brim: "But a lake that overflows stands exactly at the height of this cell: its water crosses the cell on the way to the pass, and none of the cell lies under it"
        follows_by:
          closed: [potential_evapotranspiration]
      lake:
        row_of: lakes
        units: {inflow_m3_per_year: km3_from_m3, area_m2: km2_from_m2, loss_to_air_m3_per_year: km3_from_m3,
                outflow_m3_per_year: km3_from_m3, evaporation_m3_per_year: km3_from_m3, rain_on_lake_m3_per_year: km3_from_m3,
                level_m: m}
        says: "each year {inflow_m3_per_year} of water run toward this lake, counted as if its ground were dry; flooding its {area_m2} lets the air take {loss_to_air_m3_per_year} more than the same ground would give dry, and {outflow_m3_per_year} leave over the pass; its open water gives the air {evaporation_m3_per_year} a year, and {rain_on_lake_m3_per_year} fall on it; the lake fills hollow {hollow} of the table of hollows, as a whole, and stands at {level_m} (row {row} of the table of lakes)"
  lake_level:
    says: "The surface of the lake here stands at {value} relative to the reference level."
    says_missing: "No lake covers any of this cell, so there is no lake level to give."
    follows: [lake_fraction]
    follows_missing: [lake_fraction]

Soils:
  soil_water_capacity:
    says: "The soil here can hold {value} of water."
    ends: "The chain ends here, at a model constant: until the Soils process of build step 7, every soil is given the capacity of Manabe's bucket."
    drivers:
      cell_is: {names: [land, sea]}
    cases:
      - when: {cell_is: sea}
        says: "This cell is sea: it has no soil, and so nothing that could hold water."
        ends: "The chain ends here: the cell is sea."

Biomes:
  biome:
    says: "The biome here is {value}:"
    drivers:
      rule:
        names: ["the cell is sea", "the warmest month is below freezing, so nothing grows", "Whittaker's chart places this climate here",
                "the climate lies off Whittaker's chart, and this is the nearest biome on it",
                "ice lies on the sea here: the mean temperature of the year is below -10 °C"]
        says: "{v}"
        follows_by:
          "the cell is sea": [ocean_mask]
          "ice lies on the sea here: the mean temperature of the year is below -10 °C": [surface_temperature, ocean_mask]
          "the warmest month is below freezing, so nothing grows": [surface_temperature]
      # on sea the two yearly values are missing, and a missing value is not mentioned
      yearly_temperature: {unit: C_from_K, says: "the yearly mean temperature is {v}"}
      yearly_precipitation: {unit: mm, says: "the yearly precipitation is {v}"}
      limit:
        names: [none, too_cold, too_dry, not_land]
        says_by:
          too_cold: "what limits plant life here is cold"
          too_dry: "what limits plant life here is drought"
          none: "neither cold nor drought limits plant life here"
        follows_by:
          too_cold: [surface_temperature]
          too_dry: [precipitation]
          none: [precipitation, surface_temperature]
  climate_class:
    says: "The Köppen-Geiger climate class here is {value}:"
    follows: [surface_temperature, precipitation]
    drivers:
      group:
        names: ["the cell is sea", "it is an arid climate: the year's precipitation is below ten times the dryness threshold",
                "it is a tropical climate: the coldest month is 18 °C or warmer", "it is a temperate climate",
                "it is a cold climate: the coldest month is at or below 0 °C", "it is a polar climate: the warmest month is 10 °C or colder"]
        says: "{v}"

SurfaceAge:
  surface_age:
    says: "The ground here was last renewed {value} ago (counted from the start of the history), by new ocean floor, lava, deep erosion or rising from the sea."
    follows: [volcanism, erosion_rate, ocean_mask]
