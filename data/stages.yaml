# The stages, the clock each runs on, and each clock's own settings (design, Layer 3).
# A stage on the dated clock (clock: dated) is listed after the weather and gives step: day (the default), month or
# year. None is listed here: such stages run into a run store beside a world, not in a build (Engine.run_dated, whose
# description says how their steps interleave).
stages:
  - name: setup
    clock: once
  - name: geological
    clock: geological
    round_length_my: 2.0           # the step of Cortial et al. 2019
    history_length_my: 250.0       # the designed default: 125 rounds of moving plates (build step 3)
  - name: climate
    clock: climate
  - name: weather
    clock: weather                 # computed on request, one day at a time, never stored (build step 8)
