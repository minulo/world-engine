# Tables: things that are not per cell (design, Layer 1). One row per item; one writer per table.
tables:
  plates:
    description: "One row per plate: rotation axis, angular speed, area, continental share."
    columns: {plate: int32, axis_x: float64, axis_y: float64, axis_z: float64, angular_speed_rad_per_my: float64,
              area_m2: float64, continental_share: float64, carries_continent: bool,
              centre_x: float64, centre_y: float64, centre_z: float64}
  crust_points:
    description: "One row per crust point, a sample point that rides on a plate and carries the crust: its plate, its position, crust type, thickness, ocean-floor age, mountain-building age, the running totals kept for the cause record, and the older points it was filled from, with their weights."
    columns: {plate: int32, x: float64, y: float64, z: float64, crust_type: int16, thickness_m: float32,
              ocean_age_my: float32, orogeny_age_my: float32, thickened_by_plates_m: float32, removed_by_erosion_m: float32,
              source_a: int32, source_b: int32, source_c: int32, weight_a: float32, weight_b: float32, weight_c: float32}
  tectonic_events:
    description: "One row per event: time, kind (1 subduction, 2 collision, 3 split, 4 spreading), plates, cells affected."
    columns: {time_my: float32, kind: int16, plate_a: int32, plate_b: int32, cells: int32}
  seas:
    description: "One row per body of water that the poured volume left: the height of its surface, its area and its volume. The first row is the main sea, the body with the largest area; its surface is the sea level."
    columns: {surface_m: float64, area_m2: float64, volume_m3: float64, cells: int32, lowest_cell: int32}
  hollows:
    description: "One row per closed hollow of the land, and how the hollows nest. Row 0 stands for the sea. The next rows are the hollows with one bottom each, in the order of their bottom cells; later rows are larger hollows, each made of two that fill to the pass between them. parent, sibling, first_child and second_child are rows of this table (-1 for none). spill_m is the level at which the hollow overflows, spill_from_cell the cell on its own side of that pass, spill_into_cell the cell beyond it, and spill_into_hollow the hollow which that cell drains into (0 for the sea). The last two columns describe the lake that fills the hollow to its pass."
    columns: {parent: int32, sibling: int32, first_child: int32, second_child: int32, bottom_cell: int32, bottom_m: float64,
              spill_m: float64, spill_from_cell: int32, spill_into_cell: int32, spill_into_hollow: int32,
              area_when_full_m2: float64, volume_when_full_m3: float64}

  lakes:
    description: "One row per lake that receives water: the hollow it lies in (a row of the table of hollows), the cell at its bottom, the height of its surface, its area and volume, the water that runs toward it in a year, what its surface loses to the air in a year beyond what the flooded ground would have lost, what it passes on, whether it overflows, the cell where the overflow leaves the lake and the cell it runs into (-1 for a closed lake)."
    columns: {hollow: int32, bottom_cell: int32, level_m: float64, area_m2: float64, volume_m3: float64,
              inflow_m3_per_year: float64, loss_to_air_m3_per_year: float64, outflow_m3_per_year: float64,
              overflows: bool, outlet_cell: int32, spills_into_cell: int32}
