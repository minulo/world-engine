# Tables: things that are not per cell (design, Layer 1). One row per item; one writer per table.
tables:
  plates:
    description: "One row per plate: rotation axis, angular speed, area, continental share."
    columns: {plate: int32, axis_x: float64, axis_y: float64, axis_z: float64, angular_speed_rad_per_my: float64,
              area_m2: float64, continental_share: float64, carries_continent: bool,
              centre_x: float64, centre_y: float64, centre_z: float64}
  crust_points:
    description: "One row per crust point, a sample point that rides on a plate and carries the crust: its plate, its position, crust type, thickness, ocean-floor age, mountain-building age, the running totals kept for the cause record, and the older points it was filled from, with their weights."
    columns: {plate: int32, x: float64, y: float64, z: float64, crust_type: int16, thickness_m: float32,
              ocean_age_my: float32, orogeny_age_my: float32, thickened_by_plates_m: float32, removed_by_erosion_m: float32,
              source_a: int32, source_b: int32, source_c: int32, weight_a: float32, weight_b: float32, weight_c: float32}
  tectonic_events:
    description: "One row per event: time, kind (1 subduction, 2 collision, 3 split, 4 spreading), plates, cells affected."
    columns: {time_my: float32, kind: int16, plate_a: int32, plate_b: int32, cells: int32}
  seas:
    description: "One row per body of water that the poured volume left: the height of its surface, its area and its volume. The first row is the main sea, the body with the largest area; its surface is the sea level."
    columns: {surface_m: float64, area_m2: float64, volume_m3: float64, cells: int32, lowest_cell: int32}
  hollows:
    description: "One row per closed hollow of the land, and how the hollows nest. Row 0 stands for the sea. The next rows are the hollows with one bottom each (Drainage writes them in the order of their bottom cells; no reader relies on that order); later rows are larger hollows, each made of two that fill to the pass between them. parent, sibling, first_child and second_child are rows of this table (-1 for none). spill_m is the level at which the hollow overflows, spill_from_cell the cell on its own side of that pass, spill_into_cell the cell beyond it, and spill_into_hollow the hollow which that cell drains into (0 for the sea). The last two columns describe the lake that fills the hollow to its pass."
    # The rules a writer of this table must keep. Hydrology checks them on reading and refuses a table that breaks one
    # (library/lakes.py, check_table). One thing the check cannot show: that the pass a hollow names is its lowest.
    rules:
      - "Row 0 is the sea: no parent, no parts."
      - "Rows 1 to H are the hollows with one bottom, one for every land cell without a receiver: that cell is the row's bottom_cell. Down its receivers the water of every cell ends in the sea or at one of these bottoms, and the field depression_id holds the row of that bottom (0 for the sea)."
      - "Every later row is made of two earlier rows, its first_child and second_child, which name it as their parent and each other as sibling, and no other row names it as parent. A parent stands in a later row than its parts."
      - "A hollow inside another always names its pass. The two cells of a pass are neighbours: spill_from_cell drains into the hollow itself or into a part of it, and spill_into_cell does not. spill_into_hollow is the row, among rows 1 to H, of the hollow that the cell beyond the pass drains into (0 if it drains to the sea), and never a larger hollow around that cell."
      - "The pass of a part leads into its sibling. The two parts of a hollow share one spill_m, and no hollow overflows lower than its parts."
      - "spill_m and bottom_m are heights of the field elevation, on its datum, and never without a value or infinite where a rule asks for one: spill_m is the higher of the two cells of the pass (where the cell beyond is sea: no lower than the cell on the hollow's own side), and bottom_m is the height of bottom_cell. A hollow made of two has the bottom of its deeper part. Hydrology floods the cells whose elevation lies below spill_m."
      - "A hollow inside no other overflows into the sea, or into ground whose own hollow has a way out and overflows no higher; and no ring of hollows overflows into itself. One with no way out at all has no value for spill_m, and -1 for the cells of its pass and for spill_into_hollow."
    columns: {parent: int32, sibling: int32, first_child: int32, second_child: int32, bottom_cell: int32, bottom_m: float64,
              spill_m: float64, spill_from_cell: int32, spill_into_cell: int32, spill_into_hollow: int32,
              area_when_full_m2: float64, volume_when_full_m3: float64}
  lakes:
    description: "One row per lake that receives water: the hollow it lies in (a row of the table of hollows), the cell at its bottom, the height of its surface, its area and volume. Three numbers are the model's own books and add up exactly, inflow less loss is outflow: inflow_m3_per_year is the water that runs toward the lake in a year, counted as if none of its ground were flooded (so it holds the rain on the lake's own cells, less what their ground would have given the air); loss_to_air_m3_per_year is what the lake's surface loses beyond what the flooded ground would have lost; outflow_m3_per_year is what leaves over the pass. left_over_m3_per_year is water that reaches a lake with no way out beyond what its whole surface can lose, which the model drops. rain_on_lake_m3_per_year and evaporation_m3_per_year are the rain and snow that fall on the lake's surface and what its open water gives the air: with them, what rivers and the lake's own shores deliver is close to outflow plus evaporation less rain. overflows says whether the lake runs over its pass; outlet_cell is the cell where the overflow leaves the lake and spills_into_cell the cell it runs into (-1 for a lake that does not overflow)."
    columns: {hollow: int32, bottom_cell: int32, level_m: float64, area_m2: float64, volume_m3: float64,
              inflow_m3_per_year: float64, loss_to_air_m3_per_year: float64, outflow_m3_per_year: float64,
              left_over_m3_per_year: float64, rain_on_lake_m3_per_year: float64, evaporation_m3_per_year: float64,
              overflows: bool, outlet_cell: int32, spills_into_cell: int32}
