# Which implementation fills each process slot, the fields each slot must write, and every constant of
# every model, with the range of planet parameters in which each model is expected to hold (design, Layer 1).
# A constant may be given per mesh level as {by_level: {5: ..., 7: ...}}.
# Labels in comments: [DOCUMENTED] a source the design document cites and I opened; [INFERRED] my reasoning;
# [UNVERIFIED] recalled, not looked up; [PROVISIONAL] a first value that an Earth test must tune.

shared:
  lapse_rate_k_per_km: 6.5                     # cooling of air with height [UNVERIFIED: the standard atmosphere's value]
  freezing_point_k: 273.15
  sea_freezing_point_k: 271.35                 # sea water freezes near -1.8 C [UNVERIFIED: textbook value]

slots:
  PlanetGeometry:
    implementation: worldengine.processes.planet_geometry:SphereGeometry
    standing: Established
    model: "Geometry of a sphere; the Coriolis parameter is twice the spin rate times the sine of latitude."
    ignores: "The flattening of a planet by its own spin."
    wrong_where: "Fast-spinning planets, whose equators bulge."
    writes: [latitude, longitude, cell_area, coriolis_parameter]

  Tectonics:
    implementation: worldengine.processes.tectonics_snapshot:SnapshotPlates
    standing: Adapted
    model: "One snapshot of seeded plates, after the plate model of Cortial et al. 2019: rigid plates turning about axes through the planet's centre, with thicker crust where plates close."
    ignores: "Time: nothing has moved. The floor's age is read off the distance to the nearest spreading ridge. Island arcs, hot spots, shelves and rifts are absent."
    wrong_where: "Wherever a history matters. The size and width of the thickening are tuned numbers. Build step 3 replaces this with the full plate history."
    writes: [plate_id, plate_velocity, crust_type, crust_thickness, ocean_crust_age, orogeny_age, boundary_kind,
             boundary_distance, convergence_rate, volcanism, "table:crust_points", "table:plates", "table:tectonic_events"]
    constants:
      plates: 14                               # [INFERRED: a number of large plates like Earth's; the paper seeds its own]
      plate_speed_cm_per_year: [1.0, 9.0]      # [UNVERIFIED: the range of Earth's plate speeds as I recall it]
      outline: {waves: 24, wave_number: [2.0, 9.0], amplitude_rad: 0.10}        # how wavy the plate outlines are [INFERRED]
      continents:
        fraction: 0.40                         # share of the surface that is continental crust [UNVERIFIED: about Earth's, shelves included]
        plate_share: 0.5                       # share of plates that lean toward carrying a continent [INFERRED]
        plate_bias: 0.8                        # weight of that lean in the score [INFERRED]
        interior_weight: 0.8                   # weight of the distance from the plate's edge in the score [INFERRED]
        waves: 16
        wave_number: [1.5, 6.0]
      thickness:
        continental_normal_m: 35000.0          # [UNVERIFIED: textbook value]; must equal Isostasy's normal thickness
        continental_excess_m: 1500.0           # mean thickness above normal, so that most continental crust stands above the sea [PROVISIONAL]
        variation_m: 2500.0                    # spread of the seeded thickness [PROVISIONAL]
        variation_waves: 32
        variation_wave_number: [3.0, 14.0]
        oceanic_m: 7000.0                      # [UNVERIFIED: textbook value]
      boundaries:
        transform_ratio: 0.5                   # closing or opening slower than this share of the sliding speed counts as sliding past [INFERRED]
        minimum_speed_m_per_year: 0.002
      orogeny:
        subduction_thickening_m: 18000.0       # crust added behind a trench at the reference speed [PROVISIONAL: tuned, as the paper's uplift is]
        subduction_width_km: 600.0
        collision_thickening_m: 25000.0        # crust added where continents collide [PROVISIONAL]
        collision_width_km: 1200.0
        reference_speed_m_per_year: 0.05
        maximum_speed_factor: 1.2
        smoothing_km: 150.0                    # a belt has no sharp ends: the thickening is spread over this length [INFERRED]
        active_above_m: 500.0                  # thickening above this counts as mountain building acting now
      ocean_age: {maximum_my: 180.0, minimum_half_rate_m_per_year: 0.005}   # [UNVERIFIED: Earth's oldest floor is about this old]
      volcanism: {arc_distance_km: 200.0, arc_width_km: 150.0, ridge_width_km: 150.0}   # [INFERRED]
      zones: {ridge_km: 300.0, transform_km: 200.0}
    expected_range:
      radius_m: [5.0e+6, 8.0e+6]               # the plate picture is tuned to an Earth-sized planet [INFERRED]

  Isostasy:
    implementation: worldengine.processes.isostasy_airy:AiryIsostasy
    standing: Assembled
    model: "Airy isostasy: crust floats on denser rock, so thicker crust stands higher. Ocean depth follows the age of the floor (Parsons and Sclater 1977)."
    ignores: "Ground held up or pulled down by flow deep below, differences in how stiff the plate is, the weight of sediment and of water. It makes no deep ocean trenches."
    wrong_where: "Broad swells and high plateaus far from plate edges, basins beside mountain belts, trenches."
    writes: [elevation]
    constants:
      crust_density_kg_m3: 2800.0              # [UNVERIFIED: textbook value]
      mantle_density_kg_m3: 3300.0             # [UNVERIFIED: textbook value]
      continental_normal_thickness_m: 35000.0  # crust of this thickness stands at the reference level
      root_smoothing_km: 150.0                 # the root follows the thickness smoothed over this length [INFERRED]
      ocean_floor:
        ridge_depth_m: 2500.0                  # [DOCUMENTED: Parsons and Sclater 1977, abstract]
        deepening_m_per_root_my: 350.0         # [DOCUMENTED: the same]
        young_limit_my: 70.0                   # [DOCUMENTED: the same]
        old_floor_depth_m: 6400.0              # [DOCUMENTED: the same]
        levelling_time_my: 62.8                # [UNVERIFIED: recalled from the paper's body, which I did not open]
        reference_offset_m: 1100.0             # [PROVISIONAL: set so that the default world's sea comes to rest near the reference
                                               #  level. The design's tuning on Earth's crust thickness and floor ages (Layer 5) is
                                               #  not done yet: the Earth data could not be fetched where this was built]
    expected_range:
      surface_gravity_m_s2: [5.0, 20.0]

  SeaLevel:
    implementation: worldengine.processes.sea_level_pour:PouredSea
    standing: Adapted
    model: "The planet's volume of water is poured in at the lowest point; it fills each hollow to its rim and spills into the next (Fill-Spill-Merge, Barnes et al. 2021). The sea level is the surface of the largest body."
    ignores: "Tides, the sinking of the sea floor under the weight of water, and water held as ice, in lakes, in the ground and in the air."
    wrong_where: "Straits narrower than a cell open or close by accident. With little water it all collects in the deepest hollows and the climate is not consulted."
    writes: [ocean_mask, sea_depth, height_above_sea, coast_distance, "table:seas"]
    expected_range:
      surface_water_volume_m3: [0.5e+18, 3.0e+18]     # outside it the sea level lies far from the reference level [INFERRED]

  Insolation:
    implementation: worldengine.processes.insolation_daily_mean:DailyMeanInsolation
    standing: Established
    model: "The astronomical formula for daily-mean sunlight from latitude, season, tilt and orbit (Rose, The Climate Laboratory)."
    ignores: "The air, the time of day, shading by terrain, and the ageing of the star."
    wrong_where: "It is exact for what it claims. Planets whose day is a large part of their year fall outside it."
    writes: [insolation]
    constants:
      samples_per_month: 8                     # moments averaged for each monthly mean

  Albedo:
    implementation: worldengine.processes.albedo_surface_table:SurfaceTableAlbedo
    standing: Rule
    model: "A table sets reflection by surface type (sea, land, snow and ice), with a constant share for cloud and more reflection at low sun angles."
    ignores: "Where clouds actually form, plant cover, dust, and the depth of snow."
    wrong_where: "The cloud decks of cool subtropical seas and the cloud bands of the tropics. Clouds are the largest known gap in the climate stage."
    writes: [albedo]
    constants:
      cloud_share: 0.255                       # [INFERRED: set so that an ice-free planet with the table below reflects the 0.319 of North et al. 1981]
      low_sun_term: 0.202                      # times the second Legendre polynomial of sin(latitude) [DOCUMENTED: North, Cahalan and Coakley 1981, eq. 18]
      surface:
        sea: 0.07                              # [UNVERIFIED: typical value]
        land: 0.20                             # [UNVERIFIED: typical value for ground with some plants]
        ice: 0.658                             # [INFERRED: gives ice-covered cells the 0.62 of North et al. 1981]
      ice_ramp_k: 2.0                          # width of the change from bare to ice-covered around the freezing point, so that the rounds settle [INFERRED]

  EnergyBalance:
    implementation: worldengine.processes.energy_balance_spreading:SpreadingEnergyBalance
    standing: Adapted
    model: "The energy balance model of North, Cahalan and Coakley 1981: absorbed sunlight equals heat lost to space (A + B T) plus heat spread sideways, with land and sea differing in how slowly they warm. First version: spreading only."
    ignores: "The layers of the air, heat carried as water vapour, wind and ocean heat (folded into the spreading constant), sea ice as a lid on the sea, and the make-up of the air: every planet gets Earth's greenhouse effect."
    wrong_where: "It spreads heat over about 3,500 km, so anything narrower is smoothed away. Coasts facing the wind are not milder. High plateaus are too cold."
    writes: [surface_temperature]
    constants:
      loss_at_zero_celsius_w_m2: 203.3         # A [DOCUMENTED: North, Cahalan and Coakley 1981]
      loss_per_kelvin_w_m2_k: 2.09             # B [DOCUMENTED: the same]
      spreading_constant_w_m2_k: 0.649         # D, on a sphere of the radius below [DOCUMENTED: the same]
      spreading_constant_radius_m: 6.371e+6    # the radius D was fitted on; the spreading length of 3,550 km is kept on other planets [INFERRED]
      heat_capacity_land_j_m2_k: 1.055e+7      # 0.16 B years [DOCUMENTED: the same paper, p. 100], with B above and a year of 3.156e7 s
      heat_capacity_sea_j_m2_k: 3.10e+8        # 4.7 B years, an ocean mixed layer of 75 m [DOCUMENTED: the same]
      time_waves: 2                            # the yearly mean plus this many waves in time (yearly, half-yearly)
    expected_range:
      radius_m: [5.0e+6, 8.0e+6]
      axial_tilt_deg: [0.0, 54.0]              # above about 54 the poles get more yearly sunlight than the equator
      surface_water_volume_m3: [0.5e+18, 3.0e+18]

  Circulation:
    implementation: worldengine.processes.circulation_belts:BeltCirculation
    standing: Assembled
    model: "Pressure belts tied to the tropical overturning loop (edge from the scaling of Lu, Vecchi and Reichler 2007) and to the latitude of fastest storm growth; warm surfaces lower the pressure (Lindzen and Nigam 1987); surface wind from a balance of pressure, spin and drag; wind aloft from the thermal wind; storm growth from the Eady rate."
    ignores: "Single storms, including the ones that drive the westerlies; waves raised by mountain ranges; the turning aside of wind by high ground; how monsoons really work."
    wrong_where: "The seasonal shift of the tropical rain belt, monsoons, storm paths downwind of great ranges, and near the equator, where the thermal wind relation fails. Planets with high tilt or a spin far from Earth's."
    writes: [sea_level_pressure, wind, steering_wind, subsidence, baroclinicity]
    constants:
      band_deg: 2.0                            # width of the latitude bands used for means around the planet
      stability_per_s: 0.012                   # how strongly air resists being lifted [UNVERIFIED: typical value for Earth's lower air]
      weather_layer_depth_m: 11000.0           # [UNVERIFIED: typical depth of Earth's weather layer]
      hadley_edge_factor: 1.0                  # edge = factor * sqrt(stability * depth / (spin * radius)); 30.5 degrees for Earth [INFERRED]
      hadley_edge_limits_deg: [10.0, 50.0]
      air_density_kg_m3: 1.2
      drag_per_s: 1.6e-5                       # drag on the ground as a rate [PROVISIONAL: chosen so that the trade winds blow at about 5 m/s toward the west and 2 m/s toward the equator, as I recall Earth's]
      warm_layer_depth_m: 3000.0               # [DOCUMENTED: Lindzen and Nigam 1987 treat the air below 700 millibars, roughly 3 km by my conversion]
      reference_temperature_k: 288.0
      warm_smoothing_km: 400.0                 # the pressure answers to temperature over this length, not cell by cell [INFERRED]
      thermal_wind_floor_deg: 10.0             # the thermal wind relation fails nearer the equator than this
      steering_height_m: 5000.0
      eady_coefficient: 0.31                   # [DOCUMENTED: Freie Universität Berlin, after Hoskins and Valdes 1990]
      mean_pressure_pa: 101325.0
      belts:
        subtropical_high_pa: 650.0             # [PROVISIONAL: belt depths chosen near Earth's yearly-mean pattern as I recall it]
        equatorial_low_pa: 200.0
        subpolar_low_pa: 1000.0                # this sets the strength of the westerlies: the rule the design flags
        polar_pa: 300.0
        storm_search_from_edge_deg: 5.0
        storm_search_to_deg: 75.0
        storm_sharpness: 8.0
        low_minimum_from_edge_deg: 15.0
        low_limit_deg: 78.0
      overturning:
        rising_search_deg: 30.0
        rising_sharpness_per_k: 2.0
        rising_limit_deg: 20.0
        rising_margin_from_edge_deg: 5.0
        rising_width_deg: 7.0
        rising_speed_mm_s: 6.0                 # [PROVISIONAL: order of Earth's mean ascent in the tropical rain belt]
        sinking_position: 0.85                 # centre of the sinking branch, as a share of the way to the loop's edge
        sinking_width_deg: 9.0
        winter_loop_power: 1.5                 # the wider (winter) loop is stronger by this power of its width [INFERRED]
        branch_threshold: 0.05
    expected_range:
      rotation_period_s: [43200.0, 172800.0]
      axial_tilt_deg: [0.0, 35.0]
      radius_m: [5.0e+6, 8.0e+6]

  Moisture:
    implementation: worldengine.processes.moisture_one_layer:OneLayerMoisture
    standing: Adapted
    model: "A one-layer water budget, as in the UVic model: vapour leaves the sea and travels with the wind. Rain rises steeply with the humidity of the column (Bretherton, Peters and Back 2004). Air forced up a slope rains, and rain is suppressed under sinking air."
    ignores: "The layers of the air, how thunderstorms organise, air blocked and turned aside by ranges, evaporation from land, passing storms."
    wrong_where: "Rain totals in the tropics, ranges narrower than a cell, and hot land near 30 degrees in summer, where one layer of air tends to rain where Earth has desert."
    writes: [ocean_evaporation, column_water, precipitation, snowfall]
    constants:
      rain_law:                                # rain in mm a day = exp(steepness * (humidity - humidity_at_one_mm_per_day))
        steepness: 11.4                        # [DOCUMENTED for the form: Bretherton, Peters and Back 2004, monthly data over tropical seas.
        humidity_at_one_mm_per_day: 0.522      #  UNVERIFIED for these two numbers: the paper's page did not return them; recalled.
                                               #  To check: the fit to monthly data in section 5 and Fig. 6 of that paper]
        reference_column_kg_m2: 60.0           # outside the tropics the rate is scaled by saturation column / this [INFERRED: my extension]
      sinking_shift: 0.10                      # sinking air at the reference speed raises the humidity needed for a given rain by this [PROVISIONAL]
      newton_steps: 6
      exchange_coefficient: 1.3e-3             # bulk coefficient of evaporation from the sea [UNVERIFIED: typical value]
      gust_m_s: 4.0                            # wind that always stirs the sea surface [INFERRED]
      vapour_scale_height_m: 2500.0            # depth of the layer that holds the vapour [UNVERIFIED: typical value]
      mixing_m2_s: 3.0e+6                      # spreading of vapour by all stirring the model does not resolve, storms included
                                               # [PROVISIONAL: such models use 1 to 3 million as I recall; the upper value is used until storms are added]
      transport_wind_factor: 0.5               # wind that carries the vapour, as a multiple of the surface wind [PROVISIONAL: only
                                               # the lowest air flows into the rain belt, so the whole column converges more slowly]
      rising_ground_efficiency: 0.3            # share of the vapour lifted over a slope that falls as rain [PROVISIONAL: must be calibrated]
      sinking_reference_mm_s: 3.0              # the sinking speed at which the shift above is reached in full [PROVISIONAL]
      coarser_meshes: 4                        # the budget is solved on a ladder of this many coarser meshes below the world's own
      maximum_trips: 30                        # cap on the trips down the ladder and back, on each mesh
      coarsest_cycles: 20                      # sweeps on the coarsest mesh in each trip
      tolerance_kg_m2: 2.0e-3                  # the largest change of the last sweep must fall below this
      saturation:                              # saturation vapour pressure over water [UNVERIFIED: the formula of Bolton 1980 as I recall it]
        pressure_at_zero_pa: 611.2
        exponent_factor: 17.67
        exponent_offset_k: 29.65
        vapour_gas_constant_j_kg_k: 461.5
      snow: {all_rain_above_k: 276.15, all_snow_below_k: 270.15}     # [INFERRED: a ramp around freezing for monthly means]
    expected_range:
      surface_gravity_m_s2: [5.0, 20.0]

  Biomes:
    implementation: worldengine.processes.biomes_whittaker_koppen:WhittakerKoppen
    standing: Established
    model: "Whittaker's chart of mean yearly temperature against yearly precipitation, with the Köppen-Geiger climate class of Peel, Finlayson and McMahon 2007 computed alongside."
    ignores: "Seasons (the chart sees only yearly values), soils, fire, grazing, competition over time, and the level of carbon dioxide."
    wrong_where: "The edges of savanna and grassland that fire sets, and climates with one very dry season. A climate off the chart takes the nearest biome on it."
    writes: [climate_class, biome, vegetation_cover]
    constants:
      chart: {from_file: {file: biomes, key: biomes}}        # outlines of the chart, with each biome's plant cover
      chart_scale: {temperature_c: 45.0, precipitation_cm: 450.0}   # spans of the chart, to judge "nearest" off the chart [INFERRED]
      mm_per_cm: 10.0
      limited_by_cold: [tundra, ice]
      limited_by_dryness: [subtropical_desert, temperate_grassland_desert, woodland_shrubland]
      koppen:                                  # [DOCUMENTED: Peel, Finlayson and McMahon 2007, Table 1; temperatures in C, precipitation in mm]
        months: 12
        summer_months_north: [4, 5, 6, 7, 8, 9]    # summer is the warmer of April-September and October-March
        arid_per_degree_mm: 2.0                # threshold = 2 * mean yearly temperature ...
        arid_summer_rain_mm: 28.0              # ... + 28 if 70 % of the rain falls in summer
        arid_even_rain_mm: 14.0                # ... + 14 otherwise, and + 0 if 70 % falls in winter
        season_share: 0.7
        arid_factor: 10.0                      # arid (B) if yearly precipitation < 10 * threshold
        desert_factor: 5.0                     # desert (BW) if < 5 * threshold, else steppe (BS)
        arid_hot_c: 18.0
        tropical_coldest_c: 18.0
        rainforest_driest_mm: 60.0
        monsoon_base_mm: 100.0
        monsoon_divisor: 25.0
        warm_month_c: 10.0
        cold_coldest_c: 0.0                    # temperate above, cold at or below; the paper uses 0 and not -3
        dry_summer_mm: 40.0
        dry_summer_ratio: 3.0
        dry_winter_ratio: 10.0
        hot_summer_c: 22.0
        warm_summer_months: 4
        severe_winter_c: -38.0
        frost_warmest_c: 0.0
