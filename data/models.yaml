# Which implementation fills each process slot, the fields each slot must write, and every constant of
# every model, with the range of planet parameters in which each model is expected to hold (design, Layer 1).
# A constant may be given per mesh level as {by_level: {5: ..., 7: ...}}.
# Labels in comments: [DOCUMENTED] a source the design document cites and I opened; [INFERRED] my reasoning;
# [UNVERIFIED] recalled, not looked up; [PROVISIONAL] a first value that an Earth test must tune.

shared:
  lapse_rate_k_per_km: 6.5                     # cooling of air with height [UNVERIFIED: the standard atmosphere's value]
  freezing_point_k: 273.15                     # snow on the ground melts in months warmer than this
  sea_ice_yearly_mean_below_k: 263.15          # ice lies on the sea where the mean temperature of the year is below this, -10 C.
                                               # [DOCUMENTED: North, Cahalan and Coakley 1981, eq. 15 and p. 102, put the edge of
                                               #  their ice cap at "the mean annual -10 C isotherm"; INFERRED: applying it to the
                                               #  sea only is my reading]
  weather_look_back_days: 8                    # the window of days that the weather of a day is drawn from: no storm lives longer,
                                               # and wet and dry spells remember no further back [PROVISIONAL: mid-latitude storms
                                               # live a few days to a week, UNVERIFIED]

slots:
  PlanetGeometry:
    implementation: worldengine.processes.planet_geometry:SphereGeometry
    standing: Established
    model: "Geometry of a sphere; the Coriolis parameter is twice the spin rate times the sine of latitude."
    ignores: "The flattening of a planet by its own spin."
    wrong_where: "Fast-spinning planets, whose equators bulge [INFERRED: the model takes the planet for a sphere]."
    writes: [latitude, longitude, cell_area, coriolis_parameter]

  Tectonics:
    # The snapshot of build steps 1 and 2 is still there: worldengine.processes.tectonics_snapshot:SnapshotPlates
    # (it uses the constants below that it names, and ignores history, subduction, collision, rifting and slab_pull).
    implementation: worldengine.processes.tectonics_plate_history:PlateHistory
    standing: Adapted
    model: "A history of moving plates after Cortial et al. 2019: crust points ride on rigid plates; ocean floor dives at trenches and thickens the crust behind them; continents collide, pile up and weld; new floor forms where plates part; plates split and are pulled toward their trenches. The rules thicken the crust and Isostasy lifts it."
    ignores: "The paper's own erosion and ocean-floor height rules (FluvialErosion and Isostasy replace them), hot spots and plumes, the shape of slabs, sediment, mantle flow beyond slab pull."
    wrong_where: "The size of the thickening and the chance of rifting are tuned numbers; a weld is all or nothing; fronts are as rough as the mesh. [INFERRED: from the method; not measured against Earth]"
    writes: [plate_id, plate_velocity, crust_type, crust_thickness, ocean_crust_age, orogeny_age, boundary_kind,
             boundary_distance, convergence_rate, volcanism, "table:crust_points", "table:plates", "table:tectonic_events"]
    constants:
      plates: 14                               # [INFERRED: a number of large plates like Earth's; the paper seeds its own]
      plate_speed_cm_per_year: [1.0, 9.0]      # [UNVERIFIED: the range of Earth's plate speeds as I recall it]
      outline: {waves: 24, wave_number: [2.0, 9.0], amplitude_rad: 0.10}        # how wavy the plate outlines are [INFERRED]
      continents:
        fraction: 0.40                         # share of the surface that is continental crust [UNVERIFIED: about Earth's, shelves included]
        plate_share: 0.5                       # share of plates that lean toward carrying a continent [INFERRED]
        plate_bias: 0.8                        # weight of that lean in the score [INFERRED]
        interior_weight: 0.8                   # weight of the distance from the plate's edge in the score [INFERRED]
        waves: 16
        wave_number: [1.5, 6.0]
      thickness:
        continental_normal_m: 35000.0          # [UNVERIFIED: textbook value]; must equal Isostasy's normal thickness
        continental_excess_m: 1500.0           # mean thickness above normal, so that most continental crust stands above the sea [PROVISIONAL]
        variation_m: 2500.0                    # spread of the seeded thickness [PROVISIONAL]
        variation_waves: 32
        variation_wave_number: [3.0, 14.0]
        oceanic_m: 7000.0                      # [UNVERIFIED: textbook value]
      boundaries:
        transform_ratio: 0.5                   # closing or opening slower than this share of the sliding speed counts as sliding past [INFERRED]
        minimum_speed_m_per_year: 0.002
        direction_reach_cells: 4.0             # the direction of a boundary is taken over the stretch within this many cell spacings of a cell
                                               # [MEASURED: with 4, the direction of a straight boundary is off by at most 10 degrees; with 2, by 20]
        direction_known_above: 0.3             # the sides within reach must add up to more than this share of their length for the
                                               # boundary to have a direction there; otherwise the cell counts as sliding past
                                               # [MEASURED: a straight boundary gives 0.67 to 0.87. A plate up to about three cells
                                               #  across has its whole outline within reach, which adds up to next to nothing: such
                                               #  a plate gets no ridge or trench (third check: none at three cells across; at four
                                               #  cells, 27 of 140 boundary cells get a direction). With 0.02, round plates two cells
                                               #  in radius that only spin showed false ridges and trenches at 10 of 322 boundary cells]
      orogeny:
        subduction_thickening_m: 18000.0       # crust added behind a trench at the reference speed [PROVISIONAL: tuned, as the paper's uplift is]
        subduction_width_km: 600.0
        collision_thickening_m: 25000.0        # crust added where continents collide [PROVISIONAL]
        collision_width_km: 1200.0
        reference_speed_m_per_year: 0.05
        maximum_speed_factor: 1.2
        smoothing_km: 150.0                    # a belt has no sharp ends: the thickening is spread over this length [INFERRED]
        active_above_m: 500.0                  # thickening above this counts as mountain building acting now
      ocean_age:
        maximum_my: 180.0                      # [UNVERIFIED: Earth's oldest floor is about this old]
        minimum_half_rate_m_per_year: 0.005
        equal_within_my: 0.1                   # two floors whose ages differ by less than this count as equally old [INFERRED]
      volcanism: {arc_distance_km: 200.0, arc_width_km: 150.0, ridge_width_km: 150.0}   # [INFERRED]
      zones: {ridge_km: 300.0, transform_km: 200.0}
      # ---- the plate history (build step 3). [DOCUMENTED: Cortial et al. 2019, as a page reader gave it on 2026-10-06,
      #      docs/step3/GOAL.md; not seen as printed] marks the paper's numbers; the rest are mine.
      history:
        contact_cells: 0.5                     # points of two plates nearer than this many cell spacings overlap [INFERRED: the crust trial's rule]
        gap_cells: 0.75                        # a cell with no point within this many spacings lies in a gap: new floor [INFERRED: the crust trial's rule]
        resample_every_rounds: 10              # the paper resamples every 10 to 60 steps [DOCUMENTED]; the fastest end is taken
        flat_determinant: 1.0e-12              # three old points whose places span less than this lie in a row [INFERRED]
        equal_age_my: 0.1                      # two fronts whose summed floor ages differ by less than this count as equally old
        minimum_thickness_m: 1000.0            # erosion thins no crust below this [INFERRED]
        maximum_thickness_m: 70000.0           # thickening stops here [UNVERIFIED: about the thickest crust on Earth, under Tibet]
        arc_becomes_continental_above_m: 20000.0   # ocean crust thickened past this is an island arc grown into continent [PROVISIONAL]
        active_above_m_per_round: 100.0        # thickening faster than this counts as mountain building acting now [PROVISIONAL]
        crust_flow: {above_m: 50000.0, length_km: 300.0}   # thicker crust flows sideways [PROVISIONAL; a departure from the design]
        collision_spread_km: 600.0             # consumed continental crust is piled within this distance of the front [PROVISIONAL]
        weld_after_rounds: 5                   # a collision that has gone on this many rounds welds the terrane (10 My, about 300 km at 3 cm/yr;
                                               #  the paper welds at 300 km of overlap [DOCUMENTED])
        weld_reach_cells: 1.5                  # the terrane is the lower plate's continent within this many spacings of the consumed crust
      subduction:
        uplift_m_per_my: 600.0                 # u0 = 0.6 mm/y [DOCUMENTED]
        reference_speed_m_per_year: 0.1        # v0 = 100 mm/y [DOCUMENTED]
        maximum_speed_factor: 1.5              # [INFERRED]
        reach_km: 1800.0                       # rs, where the uplift fades to zero [DOCUMENTED]
        peak_km: 300.0                         # the control distance at which it peaks [PROVISIONAL: the paper's value was not read out]
        lowest_m: -10000.0                     # zt [DOCUMENTED]
        highest_m: 10000.0                     # zc [DOCUMENTED]
        floor_height: {ridge_m: -1000.0, abyssal_m: -6000.0,      # [DOCUMENTED: the paper's Table 3]
                       abyssal_age_my: 100.0}                     # floor reaches the abyssal plain at this age [PROVISIONAL]
        height_share_of_thickening: 0.1515     # 1 - 2800/3300: Isostasy's share of a broad thickening that becomes height [INFERRED]
      rifting:
        rate_per_round: 0.002                  # L0 of P = L exp(-L) [PROVISIONAL: about one split in 1,000 My for a plate of mean size]
        continent_weight: 1.0                  # f(continental share) = 1 + weight * share [PROVISIONAL]
        smallest_share_of_mean: 0.5            # a plate smaller than this share of the starting mean area does not split [INFERRED]
        most_per_round: 1
        waves: 8
        wave_number: [2.0, 8.0]
        warp_rad: 0.15
        parting_speed_cm_per_year: [1.0, 3.0]  # the parts move apart at this speed each [PROVISIONAL]
      slab_pull:
        turn_share_per_my: 0.01                # the share of a plate's motion turned toward its diving fronts each My [PROVISIONAL]
        fastest_cm_per_year: 10.0              # no plate turns faster than this at its widest circle [UNVERIFIED: Earth's fastest plates]
    expected_range:
      radius_m: [5.0e+6, 8.0e+6]               # the plate picture is tuned to an Earth-sized planet [INFERRED]
      stage.geological.history_length_my: [2.0, 250.0]    # [MEASURED: the long trial drifts from the first 250 My on; docs/BUILD_NOTES.md 12.5]

  Isostasy:
    implementation: worldengine.processes.isostasy_airy:AiryIsostasy
    standing: Assembled
    model: "Airy isostasy: crust floats on denser rock, so thicker crust stands higher. Ocean depth follows the age of the floor (Parsons and Sclater 1977)."
    ignores: "Ground held up or pulled down by flow deep below, differences in how stiff the plate is, the weight of sediment and of water. It makes no deep ocean trenches."
    wrong_where: "Broad swells and high plateaus far from plate edges, basins beside mountain belts, trenches [INFERRED: from what the model ignores; not measured against Earth]."
    writes: [elevation]
    constants:
      crust_density_kg_m3: 2800.0              # [UNVERIFIED: textbook value]
      mantle_density_kg_m3: 3300.0             # [UNVERIFIED: textbook value]
      continental_normal_thickness_m: 35000.0  # crust of this thickness stands at the reference level
      root_smoothing_km: 150.0                 # the root follows the thickness smoothed over this length [INFERRED]
      ocean_floor:
        # [DOCUMENTED: Parsons and Sclater 1977, abstract: d = 2500 + 350 sqrt(t) m for floor of 0 to 70 My, and
        #  d = 6400 - 3200 exp(-t / 62.8) m for floor older than 20 My]
        ridge_depth_m: 2500.0
        deepening_m_per_root_my: 350.0
        young_rule_until_my: 70.0              # the first rule holds up to this age
        old_floor_depth_m: 6400.0
        old_floor_amplitude_m: 3200.0
        levelling_time_my: 62.8
        old_rule_from_my: 20.0                 # the second rule holds from this age; the process changes rule where the two cross in between
        reference_offset_m: 1100.0             # [PROVISIONAL: set, before the reviews of build step 1, so that the default world's sea
                                               #  came to rest near the reference level. The fixes of the reviews changed the plates
                                               #  and the depth of old floor, and the offset was not set again: the sea now rests 153 m
                                               #  below the reference level on the preview mesh and 225 m below it on the standard mesh
                                               #  (measured). The design's tuning on Earth's crust thickness and floor ages (Layer 5)
                                               #  replaces this number; the Earth data could not be fetched where this was built]
    expected_range:
      surface_gravity_m_s2: [5.0, 20.0]

  Lithology:
    implementation: worldengine.processes.lithology_rule_table:RuleTableLithology
    standing: Rule
    model: "A table maps the tectonic setting to a family of rock and its erodibility; the first row that matches wins."
    ignores: "Rock carried from elsewhere, weathering, the layering of rock, sediment laid down by rivers."
    wrong_where: "Everywhere a setting holds several rocks; the erodibilities are relative numbers, not measured. [INFERRED]"
    writes: [rock_type, erodibility]
    constants:
      rules:                                   # in order; the first that matches wins. [PROVISIONAL: the erodibilities are relative]
        - {rock: ocean_floor_basalt, crust: oceanic, erodibility: 0.6}
        - {rock: volcanic_arc, volcanism_above: 0.3, erodibility: 0.9}
        - {rock: young_fold_belt, orogeny_younger_than_my: 60.0, erodibility: 1.5}
        - {rock: rift_basin, boundary: [ridge], erodibility: 2.0}
        - {rock: old_mountain_roots, orogeny_younger_than_my: 1000.0, erodibility: 0.7}
        - {rock: stable_platform, erodibility: 1.0}

  FluvialErosion:
    implementation: worldengine.processes.fluvial_stream_power:StreamPowerErosion
    standing: Established
    model: "The stream power law E = K k (Q)^m S^n with n = 1, solved implicitly along the flow paths from the sea up (Braun and Willett 2013), and hillside creep as an implicit diffusion step. The water that flows is the runoff of the last climate, or a set runoff before any climate has run."
    ignores: "Where the eroded rock goes (it is laid down nowhere: the design's stated limit), glaciers, the wear of coasts, rivers narrower than a cell."
    wrong_where: "The law depends on the size of the cells: K is set per mesh level. Before the climate is rerun inside the history (build step 9) every place gets the same runoff. [INFERRED]"
    writes: [erosion_rate, erosion_thinning]
    constants:
      area_exponent_m: 0.5                     # m with n = 1: m/n = 0.5 [UNVERIFIED: the usual value on Earth]
      coefficient_per_year: {by_level: {5: 1.2e-7, 6: 1.2e-7, 7: 1.2e-7, 8: 1.2e-7}}   # K [PROVISIONAL: tuned by eye on the preview mesh]
      reference_runoff_mm_per_year: 300.0      # the runoff that K is set for, and the runoff used before any climate [UNVERIFIED: about Earth's land mean]
      creep_m2_per_year: 0.01                  # hillside diffusion [UNVERIFIED: a common value]
      sea_level_before_any_sea_m: 0.0          # the base level in the first round, before SeaLevel has run once

  SeaLevel:
    implementation: worldengine.processes.sea_level_pour:PouredSea
    standing: Adapted
    model: "The planet's volume of water is poured in at the lowest point; it fills each hollow to its rim and spills into the next (Fill-Spill-Merge, Barnes et al. 2021). The sea level is the surface of the largest body."
    ignores: "Tides, the sinking of the sea floor under the weight of water, and water held as ice, in lakes, in the ground and in the air."
    wrong_where: "A cell is sea only if its mean height lies below the sea, so a strait is closed wherever a cell that holds it has high shores: on Earth's relief the Red Sea and the Baltic are cut off by cells of which two thirds and three quarters are sea in the data, and whose mean heights are 16 m and 2 m [MEASURED: tests/test_earth.py]. With little water it all collects in the deepest hollows and the climate is not consulted [INFERRED: from the method]."
    writes: [ocean_mask, sea_depth, height_above_sea, coast_distance, "table:seas"]
    expected_range:
      surface_water_volume_m3: [0.5e+18, 3.0e+18]     # outside it the sea level lies far from the reference level [INFERRED]

  Drainage:
    implementation: worldengine.processes.drainage_lowest_neighbour:LowestNeighbourDrainage
    standing: Established
    model: "Each cell drains to its lowest neighbour. Closed hollows, how they nest and where each one overflows are found as a depression hierarchy (Barnes, Callaghan and Wickert 2020)."
    ignores: "Rivers that split, as in deltas; groundwater; valleys narrower than a cell."
    wrong_where: "A cell has one height: a river that crosses a range through a gorge narrower than a cell finds the range closed, and the mesh shows a hollow where there is none or sends the river out by another pass [INFERRED from the rule. On Earth's relief, every closed valley that was looked into is closed in the relief data themselves, or by the way those data were put on the mesh, and not by the width of a cell: docs/BUILD_NOTES.md, section 4.4]. Where heights are exactly equal the rule cannot choose; the bed, the mesh's geometry and last the order of the cells do. In the engine's own worlds that settles only which sea cell a river runs into; on relief given in whole metres it decides where whole rivers go [MEASURED: the same section]."
    writes: [flow_receiver, drainage_area, basin_id, depression_id, spill_elevation, slope, "table:hollows"]

  SurfaceAge:
    implementation: worldengine.processes.surface_age_points:PointSurfaceAge
    standing: Rule
    model: "Age grows each round and resets where lava covers the ground, where erosion cuts deep, and where land rises from the sea; ages ride on the crust points."
    ignores: "Sediment that buries a surface, soils, ice."
    wrong_where: "Ages before the history began are not known: they count from its start. [INFERRED]"
    writes: [surface_age, "table:surface_age_points"]
    constants:
      lava_above: 0.5                          # volcanism above this renews the ground [PROVISIONAL]
      deep_erosion_m_per_round: 200.0          # erosion deeper than this in a round exposes fresh rock [PROVISIONAL]

  Insolation:
    implementation: worldengine.processes.insolation_daily_mean:DailyMeanInsolation
    standing: Established
    model: "The astronomical formula for daily-mean sunlight from latitude, season, tilt and orbit (Rose, The Climate Laboratory)."
    ignores: "The air, the time of day, shading by terrain, and the ageing of the star."
    wrong_where: "It is exact for what it claims [MEASURED against the closed formulas: tests/test_processes.py]. Planets whose day is a large part of their year fall outside it [INFERRED]."
    writes: [insolation]
    constants:
      samples_per_month: 8                     # moments averaged for each monthly mean

  Albedo:
    # The first version, which decides snow and ice itself, is still there: worldengine.processes.albedo_surface_table:SurfaceTableAlbedo
    implementation: worldengine.processes.albedo_cover_table:CoverTableAlbedo
    standing: Rule
    model: "A table sets reflection by surface type (sea, bare ground, ground under plants, snow and ice), with a share for cloud, less over land than over sea in proportion to the cloud that satellites see over each (King et al. 2013), and more reflection at low sun angles (North, Cahalan and Coakley 1981). Snow and ice are where Cryosphere put them in the last round; plants come from the last round's Biomes, and hide part of the snow beneath them."
    ignores: "Where clouds actually form, dust, the darkening of old snow."
    wrong_where: "The cloud decks of cool subtropical seas, the cloud bands of the tropics and the clear skies of deserts: every sky over land has the same share of cloud, and every sky over the sea. A planet can still freeze over, more easily than in fuller models [UNVERIFIED: recalled]; the process says so in a note when snow and ice cover more than a third of the surface."
    writes: [albedo]
    constants:
      cloud_share: 0.255                       # [INFERRED: set so that an ice-free planet with the table of the first version reflects the 0.319 of North et al. 1981]
      cloud_fraction:                          # the share of the sky that cloud covers, over each surface and on the planet's mean: the
        land: 0.55                             #  cloud share above is the planet's, and each surface reflects it in proportion to its own
        sea: 0.72                              #  cloud [DOCUMENTED: King et al. 2013, MODIS, the abstract: about 55 % over land, 72 % over
        planet: 0.67                           #  ocean, 67 % globally. INFERRED: that cloud reflects as much per share of sky over each]
      low_sun_term: 0.202                      # times the second Legendre polynomial of sin(latitude) [DOCUMENTED: North, Cahalan and Coakley 1981, eq. 18]
      surface:
        sea: 0.07                              # [UNVERIFIED: typical value]
        bare_ground: 0.25                      # [UNVERIFIED: typical value for dry bare ground]
        under_plants: 0.15                     # [UNVERIFIED: typical value for forest; half cover gives the 0.20 of the first version]
        ice: 0.658                             # [INFERRED: gives ice-covered cells the 0.62 of North et al. 1981]
      snow_hidden_by_plants: 0.5               # the share of the snow's whiteness that full plant cover hides [PROVISIONAL]
      note_when_covered_above: 0.333           # [INFERRED, as in the first version]

  Cryosphere:
    implementation: worldengine.processes.cryosphere_thresholds:ThresholdCryosphere
    standing: Rule
    model: "Sea ice in the months the sea lies below the freezing point of sea water; snow and lasting ice on land from the snow store of the last round; permafrost from the year's mean between two thresholds."
    ignores: "Ice that flows, glaciers carving valleys, ice ages, the insulation of the ground by snow, sea ice blown by the wind."
    wrong_where: "No fjords or glacial lakes; the edges of ice sheets and of the permafrost zone. The thresholds are not tested against a map of Earth's frozen ground: the reference data hold none. [INFERRED]"
    writes: [snow_ice_cover, permafrost]
    constants:
      sea_freezes_below_k: 263.15              # -10 C of the air over the sea, month by month: the edge of the ice cap of North, Cahalan
                                               #  and Coakley 1981 (p. 102), taken month by month [INFERRED]. The freezing point of sea
                                               #  water (-1.8 C) put ice on 0.175 of the sea on the year's mean [MEASURED, step 6]: this
                                               #  model's temperature is the air's, which over a winter sea falls far below the water's
      sea_ice_ramp_k: 2.0                      # the change from open to covered sea is spread over this width, so that the rounds settle [INFERRED]
      full_cover_mm: 15.0                      # the ground counts as fully covered once the snow store holds this much water: Hydrology's value
      permafrost_full_below_k: 265.15          # -8 C on the year's mean: frozen ground throughout [UNVERIFIED: a common rule of thumb for continuous permafrost]
      permafrost_none_above_k: 272.15          # -1 C: no permafrost above [UNVERIFIED: a common rule of thumb for the edge of discontinuous permafrost]

  EnergyBalance:
    implementation: worldengine.processes.energy_balance_wind:WindEnergyBalance
    standing: Adapted
    model: "The energy balance model of North, Cahalan and Coakley 1981: absorbed sunlight equals heat lost to space (A + B T) plus heat spread sideways, with land and sea differing in how slowly they warm. Second version (build step 5): heat is also carried by the last round's wind, and the air that spreads out of a cell is replaced from above by air at the temperature of the air that rose where the wind gathers, so that the wind moves heat and makes none."
    ignores: "The layers of the air beyond one overturning, heat carried as water vapour, the overturning of the deep ocean (only the wind-driven ocean carries heat; the rest is folded into the spreading constant), sea ice as a lid on the sea, and the make-up of the air: every planet gets Earth's greenhouse effect."
    wrong_where: "It spreads heat over about 3,500 km, so anything narrower is smoothed away. Coasts facing the wind are not milder. High plateaus are too cold. The seasons on land are too weak unless the continent is very large: on Earth's relief northern land is 13 K warmer in July than in January where Earth's is 31 K, and too much land poleward of about 50 degrees keeps its snow all year. The whole of that miss lies in the summer: between 40 and 60 degrees north the twin's land is as cold as Earth's in its coldest month and 17 K colder in its warmest, and two thirds of it lie under snow in July [MEASURED: docs/BUILD_NOTES.md, sections 4.6 and 8]. Two causes are likely and have not been told apart: the one spreading constant, which damps the seasons of land (run alone and without snow, this process gives the middle of a continent half the swing recalled for North America), and the snow that a weak summer leaves, which reflects the next summer's sunlight [INFERRED]."
    writes: [surface_temperature]
    constants:
      loss_at_zero_celsius_w_m2: 203.3         # A [DOCUMENTED: North, Cahalan and Coakley 1981]
      loss_per_kelvin_w_m2_k: 2.09             # B [DOCUMENTED: the same]
      spreading_constant_w_m2_k: 0.52          # D, on a sphere of the radius below [CALIBRATED: tools/fit_spreading.py on the preview
                                               #  Earth twin with the ocean and the wind carrying heat (build steps 4 to 6): the fall
                                               #  from the tropics to the polar caps equals CRU's 40.0 K at 0.520; the 0.649 of North,
                                               #  Cahalan and Coakley 1981 was fitted with spreading as the only transport]
      spreading_constant_radius_m: 6.371e+6    # the radius D was fitted on; the spreading length of 3,550 km is kept on other planets [INFERRED]
      heat_capacity_land_j_m2_k: 1.055e+7      # 0.16 B years [DOCUMENTED: the same paper, p. 100], with B above and a year of 3.156e7 s
      heat_capacity_sea_j_m2_k: 3.10e+8        # 4.7 B years, an ocean mixed layer of 75 m [DOCUMENTED: the same]
      time_waves: 2                            # the yearly mean plus this many waves in time (yearly, half-yearly)
      air_column_kg_m2: 2000.0                 # the mass of air whose temperature the surface wind carries, about the lowest 200 hPa [PROVISIONAL]
      air_heat_capacity_j_kg_k: 1004.0         # [UNVERIFIED: textbook value for dry air]
      wind_heat_passes: 3
      sea_heat_capacity_j_m3_k: 4.13e+6        # the sea's heat capacity per cubic metre: 3.10e8 J/m2/K over the 75 m of North et al. 1981
      mixed_layer_step_m: 5.0                  # the stirred depth is taken in whole steps of this, so that the solver is seldom prepared again                      # the wind's heat is worked out from the round's solution and solved again this many times
    expected_range:
      radius_m: [5.0e+6, 8.0e+6]
      axial_tilt_deg: [0.0, 54.0]              # above about 54 the poles get more yearly sunlight than the equator
      surface_water_volume_m3: [0.5e+18, 3.0e+18]

  Circulation:
    implementation: worldengine.processes.circulation_monsoon:SummerSinkingCirculation
    standing: Assembled
    model: "Pressure belts tied to the tropical overturning loop (edge from the scaling of Lu, Vecchi and Reichler 2007) and to the latitude of fastest storm growth; warm surfaces lower the pressure (Lindzen and Nigam 1987); surface wind from a balance of pressure, spin and drag; wind aloft from the thermal wind; storm growth from the Eady rate."
    ignores: "Single storms, including the ones that drive the westerlies; waves raised by mountain ranges; the turning aside of wind by high ground; how monsoons really work."
    wrong_where: "The seasonal shift of the tropical rain belt, monsoons, storm paths downwind of great ranges, and near the equator, where the thermal wind relation fails. Planets with high tilt or a spin far from Earth's. [INFERRED: from what the model ignores; winds and pressure of Earth are not among the data at hand]"
    writes: [sea_level_pressure, wind, steering_wind, subsidence, baroclinicity]
    constants:
      band_deg: 2.0                            # width of the latitude bands used for means around the planet
      stability_per_s: 0.012                   # how strongly air resists being lifted [UNVERIFIED: typical value for Earth's lower air]
      weather_layer_depth_m: 11000.0           # [UNVERIFIED: typical depth of Earth's weather layer]
      hadley_edge_factor: 1.0                  # edge = factor * sqrt(stability * depth / (spin * radius)); 30.5 degrees for Earth [INFERRED]
      hadley_edge_limits_deg: [10.0, 50.0]
      air_density_kg_m3: 1.2
      drag_per_s: 1.6e-5                       # drag on the ground as a rate [PROVISIONAL: chosen so that the trade winds blow at about 5 m/s toward the west and 2 m/s toward the equator, as I recall Earth's]
      warm_layer_depth_m: 3000.0               # [DOCUMENTED: Lindzen and Nigam 1987 treat the air below 700 millibars, roughly 3 km by my conversion]
      reference_temperature_k: 288.0
      warm_smoothing_km: 400.0                 # the pressure answers to temperature over this length, not cell by cell [INFERRED]
      thermal_wind_floor_deg: 10.0             # the thermal wind relation fails nearer the equator than this
      steering_height_m: 5000.0
      eady_coefficient: 0.31                   # [DOCUMENTED: Freie Universität Berlin, after Hoskins and Valdes 1990]
      mean_pressure_pa: 101325.0
      belts:
        subtropical_high_pa: 650.0             # [PROVISIONAL: belt depths chosen near Earth's yearly-mean pattern as I recall it]
        equatorial_low_pa: 200.0
        subpolar_low_pa: 1000.0                # this sets the strength of the westerlies: the rule the design flags
        polar_pa: 300.0
        storm_search_from_edge_deg: 5.0
        storm_search_to_deg: 75.0
        storm_sharpness: 8.0
        low_minimum_from_edge_deg: 15.0
        low_limit_deg: 78.0
      overturning:
        rising_search_deg: 30.0
        rising_sharpness_per_k: 2.0
        rising_limit_deg: 20.0
        rising_margin_from_edge_deg: 5.0
        rising_width_deg: 7.0
        rising_speed_mm_s: 6.0                 # [PROVISIONAL: order of Earth's mean ascent in the tropical rain belt]
        sinking_position: 0.85                 # centre of the sinking branch, as a share of the way to the loop's edge
        sinking_width_deg: 9.0
        winter_loop_power: 1.5                 # the wider (winter) loop is stronger by this power of its width [INFERRED]
        branch_threshold: 0.05
      monsoon:                                 # the rising branch per band of longitude [build step 5]
        sector_deg: 20.0                       # width of a band of longitude [INFERRED: about the width of the Indian subcontinent]
        smoothing_sectors: 3                   # the warmest latitude is smoothed over this many bands [INFERRED]
        rising_limit_deg: 30.0                 # no farther from the equator than this, nor nearer the loop's edge than its margin [PROVISIONAL]
        share: 1.0                             # how fully the branch follows its band rather than the zonal mean [PROVISIONAL]
      summer_sinking:                          # the stand-in for descent west of heated land (Rodwell and Hoskins 2001) [build step 5]
        heating_latitudes_deg: [10.0, 40.0]    # land warmer than its latitude between these latitudes counts as heated [PROVISIONAL]
        reach_km: 3000.0                       # how far west of the heating the air sinks [PROVISIONAL: the Sahara lies about this far west of the Indian monsoon]
        smoothing_km: 800.0                    # the heating is taken over this length [PROVISIONAL]
        sinking_mm_s_per_k: 2.0                # sinking per kelvin of smoothed warmth [PROVISIONAL: puts its peak near the sinking of the overturning loop]
    expected_range:
      rotation_period_s: [43200.0, 172800.0]
      axial_tilt_deg: [0.0, 35.0]
      radius_m: [5.0e+6, 8.0e+6]

  OceanCurrents:
    implementation: worldengine.processes.ocean_wind_driven:WindDrivenOcean
    standing: Established
    model: "The wind-driven loops of one uniform layer over a flat floor: Sverdrup balance in mid-ocean, closed by a western boundary current through friction (Stommel 1948). Upwelling from the divergence of the wind-driven surface transport (Ekman), with friction near the equator. Heat carried by the loops and the drift, and taken by upwelled water."
    ignores: "Deep overturning driven by density, eddies, layers in the sea, the shape of the sea floor, sea ice as a lid."
    wrong_where: "Too little heat is carried poleward where deep overturning matters; channels that circle the globe have no coast to lean on; the western current is wider and slower than real ones, as it cannot be narrower than a few cells; straits narrower than a cell are lost. [INFERRED: the design's own list]"
    writes: [ocean_current, upwelling, mixed_layer_depth, ocean_heat_convergence]
    constants:
      air_density_kg_m3: 1.2                   # [UNVERIFIED: textbook value near the surface]
      drag_coefficient: 1.3e-3                 # of wind on the sea [UNVERIFIED: a common value]
      sea_water_density_kg_m3: 1025.0          # [UNVERIFIED: textbook value]
      sea_water_heat_capacity_j_kg_k: 3990.0   # [UNVERIFIED: textbook value]
      layer_depth_m: 1000.0                    # the one layer that the loops move [PROVISIONAL]
      heat_layer_depth_m: 300.0                # the part of the layer whose temperature is the surface's [PROVISIONAL]
      drift_depth_m: 50.0                      # the surface layer that the wind drifts, for the current at the surface [UNVERIFIED: a common Ekman depth]
      western_layer_cells: 2.0                 # the width of the western boundary layer, r / beta, in cells [INFERRED: the narrowest the mesh holds]
      western_layer_set_at_deg: 30.0           # the latitude at which that width is set [INFERRED]
      equatorial_friction_latitude_deg: 5.0    # the friction of the surface drift is the spin term at this latitude [PROVISIONAL]
      upwelling_efficiency: 0.1                # the share of the upwelled water's coldness that reaches the surface [PROVISIONAL]
      mixing_coefficient: 0.6                  # the Ekman depth scale, coefficient times u* / |f| [CALIBRATED on the preview Earth twin: the mean
                                               #  miss of the sea's July-January swing in four bands against CRU 1961-1990 is 2.46 K at
                                               #  0.4, 1.59 at 0.6, 2.30 at 0.8, 3.02 at 1.2 (build step 4). The form of the scale is recalled: UNVERIFIED]
      mixing_spin_floor_deg: 10.0              # nearer the equator f is held at its value here [INFERRED]
      mixed_layer_m: [20.0, 150.0]             # the stirred depth is kept between these [PROVISIONAL]
      upwelling_cooling_limit_w_m2: 100.0      # soft limit of the cooling by upwelling [PROVISIONAL: about the largest seen off Peru, UNVERIFIED]
      carried_heat_limit_w_m2: 250.0           # soft limit of the heat the loops and drift bring to a cell [PROVISIONAL: about the Gulf Stream's loss, UNVERIFIED]

  Moisture:
    implementation: worldengine.processes.moisture_one_layer:OneLayerMoisture
    standing: Adapted
    model: "A one-layer water budget, as in the UVic model: vapour leaves the sea, travels with a flow fitted from the surface wind and mixes sideways. Between cells of different height only the part of each column above the higher ground crosses; the air held back before high ground is partly lifted, which rains on the higher ground, and partly turned aside; behind high ground the vapour is thin. Rain rises steeply with the humidity of the column (Bretherton, Peters and Back 2004), and is suppressed under sinking air."
    ignores: "The layers of the air, how thunderstorms organise, passing storms, and how stable the air is, which decides how much of a flow goes over high ground and how much around it. The water that land gives back to the air is not worked out here: Hydrology adds it to the group this process reads, one round late."
    wrong_where: "Land gets less rain than Earth's land, a seventh less on Earth's own relief and a third less between 40 and 60 degrees north [MEASURED: docs/BUILD_NOTES.md, section 4.6]. Rain totals in the tropics, ranges narrower than a cell, and hot land near 30 degrees in summer, where one layer of air tends to rain where Earth has desert [INFERRED: none of the three was measured]. The wet zone before a long, high wall is probably too wet [INFERRED], and the rain of rising ground at a cliff grows as the cells shrink [MEASURED]."
    writes: [ocean_evaporation, column_water, precipitation, snowfall]
    constants:
      rain_law:                                # rain in mm a day = exp(steepness * (humidity - humidity_at_one_mm_per_day))
                                               #                    - exp(-steepness * humidity_at_one_mm_per_day)
        steepness: 11.4                        # [DOCUMENTED: Bretherton, Peters and Back 2004, eq. 2, the fit to monthly data over
        humidity_at_one_mm_per_day: 0.522      #  tropical seas: P = exp(11.4 (r - 0.522)) mm a day, r the humidity of the whole column.
                                               #  INFERRED: taking off the law's value at r = 0, so that air holding no water gives no
                                               #  rain, is my addition; it lowers the rate at one mm a day by 0.3 %]
        reference_column_kg_m2: 60.0           # outside the tropics the rate is scaled by saturation column / this [INFERRED: my extension]
      # The five numbers sinking_shift, exchange_coefficient, gust_m_s, mixing_m2_s and share_of_converging_wind were set
      # together by hand on the default planet [CALIBRATED], after the reviews of build step 1. The aims, from
      # Earth's yearly water budget as I recall it [UNVERIFIED: no Earth data could be fetched where this was built]:
      # evaporation from the sea near 1,200 mm a year; the rain belt at the equator near 2,000 mm; the dry belts near
      # 25 degrees and the storm belts near 50 degrees as close to 700 and 900 mm as one layer of air allows.
      # They are due again when Earth data is at hand.
      sinking_shift: 0.06                      # sinking air at the reference speed raises the humidity needed for a given rain by this
      exchange_coefficient: 0.95e-3            # bulk coefficient of evaporation from the sea. Measured values are 1.1 to 1.5 thousandths
                                               # [UNVERIFIED: typical values]; lower here because the humidity of the whole column stands
                                               # in for that of the air at the surface, which is moister
      gust_m_s: 4.0                            # wind that always stirs the sea surface, added to the surface wind [INFERRED]
      mixing_m2_s: 4.0e+6                      # spreading of vapour by all stirring the model does not resolve, storms included
      carrying_wind:                           # the flow that carries the column's vapour, made from the surface wind
                                               # [INFERRED: taking the two parts of the wind in different shares is my construction]
        share_of_turning_wind: 1.0             # of the part that circles without gathering (the trades and westerlies along their
                                               # belts): that flow is deep, and carries the whole column
        share_of_converging_wind: 0.25         # of the part that flows toward where the air rises: that flow is about a kilometre
                                               # deep while vapour reaches higher, and the model's is about twice as fast as Earth's
                                               # [UNVERIFIED: both statements are my recollection of Earth's trade winds, not looked up]
        turned_aside_reach_km: 500.0           # air that high ground holds back and does not lift spreads over this distance
                                               # before it gathers again [INFERRED: the order of the distance over which a range
                                               # slows the air before it; with 500 km a wall 2.5 km high facing a wind of 6 m/s
                                               # has 3.9 m of rain a year over the 500 km before it, on every mesh tried]
      rising_ground_efficiency: 0.08           # share of the vapour that the surface wind pushes against higher ground, below that
                                               # ground's level, that falls there as rain, at full humidity [CALIBRATED by hand.
                                               # MEASURED in the third check: a scarp 1.4 km high facing a wind of 6 m/s over a sea
                                               # at 298 K draws 5.4 kg of rain a second per metre of its length, which is 1.7 m of
                                               # rain a year over a strip 100 km wide; a wall 2.5 km high draws 8.5 to 9.4 kg. That
                                               # is the order of Earth's wet trade-wind coasts as I recall them: UNVERIFIED]
      newton_steps: 6
      vapour_scale_height_m: 2500.0            # depth of the layer that holds the vapour [UNVERIFIED: typical value]: it turns what
                                               # air can hold at the surface into what a column can hold, and it sets how much of the
                                               # layer is open above high ground for the air that is held back. (What crosses between
                                               # columns over ground of different height follows the saturation ratio, not this depth.)
      sinking_reference_mm_s: 3.0              # the sinking speed at which the shift above is reached in full [PROVISIONAL]
      coarser_meshes: 4                        # the budget is solved on a ladder of this many coarser meshes below the world's own
      maximum_trips: 30                        # cap on the trips down the ladder and back, on each mesh
      coarsest_cycles: 20                      # sweeps on the coarsest mesh in each trip
      tolerance_kg_m2: 2.0e-3                  # the solver stops when its last sweep changes no column by more than this. That is
                                               # not a bound on the error: in the default world the answer then lies 0.002 to 0.012
                                               # kg/m2 from the fully settled one, and the rain within 0.03 % of it (third check)
      saturation:                              # saturation vapour pressure over water [UNVERIFIED: the formula of Bolton 1980 as I recall it]
        pressure_at_zero_pa: 611.2
        exponent_factor: 17.67
        exponent_offset_k: 29.65
        vapour_gas_constant_j_kg_k: 461.5
        lowest_temperature_k: 150.0            # below this the formula is held at its value here [INFERRED: the formula
                                               # is a fit to ordinary air temperatures and has a pole at the offset above]
      snow: {all_rain_above_k: 276.15, all_snow_below_k: 270.15}     # [INFERRED: a ramp around freezing for monthly means]
    expected_range:
      surface_gravity_m_s2: [5.0, 20.0]

  Hydrology:
    implementation: worldengine.processes.hydrology_bucket_lakes:BucketHydrology
    standing: Assembled
    model: "A snow store with degree-day melt (Hock 2003); the air's demand for water by the Priestley-Taylor rule on the net radiation of the whole day, with the radiation formulas of Davis et al. 2017 and one share of sunshine for every cell; soil water as Manabe's bucket; runoff summed down the flow paths into rivers and through the lakes; lakes that spread in closed hollows until their loss to the air matches the water arriving, or overflow at their pass (after Fill-Spill-Merge, Barnes, Callaghan and Wickert 2021)."
    ignores: "Groundwater; the time water takes along a river; wetlands; lakes that swell and shrink with the seasons, the time a lake takes to fill, and the currents in a lake; plants; frozen ground; snow lost straight to the air; wind and the dryness of the air in the demand for water; the course of the day (the paper the formulas come from counts the hours in which the ground gains energy and gives the night's loss back as dew); clouds: every cell and month gets the same share of sunshine."
    wrong_where: "The timing of floods in very large basins, and below every lake, whose outflow keeps the seasons of its inflow. Like for like, the land of Earth's great river basins sheds two thirds of the water measured, and of the rain handed to it Earth's land gives the air 0.74 where a published budget has 0.65 [MEASURED: docs/BUILD_NOTES.md, section 4.4; the rain handed in is 3 % more than the budget's]. The cause is not established. The radiation formulas leave Earth's land 1.31 times the energy of that budget; the share of sunshine enters both formulas and no one share returns both of the budget's numbers; and the Priestley-Taylor rule's own factor fits the shortfall as well [MEASURED for the numbers; INFERRED: any cause named]. The snowfall handed to the engine in these tests is made from monthly temperatures and not measured: over the Volga's basin it is 43 % of the precipitation where a published figure is 30 %, and what the land sheds there follows it [MEASURED: python tools/earth_rivers.py, part 2]. In deserts the real demand is higher than the rule gives, so closed lakes come out too large; under the cloud of the wet tropics it is lower [UNVERIFIED: from memory of how the rule is used]. A lake smaller than a cell has no shape, and a lake's level moves in steps of the cells' heights. A hollow under snow that never melts fills and shows as a lake. About half of the default world's land drains into closed hollows and so into lakes [MEASURED]; valleys cut by erosion should mend that [INFERRED: it is tested in build step 3]."
    writes: [potential_evapotranspiration, soil_moisture, snow_water, snow_cover, runoff, runoff_annual, river_discharge,
             lake_fraction, lake_level, evapotranspiration, "table:lakes"]
    constants:
      snow:
        melt_mm_per_day_per_k: 4.0             # degree-day factor of snow melt [DOCUMENTED: Hock 2003, eq. 1 for the rule; her Table 1
                                               #  lists 2.5 to 5.5 mm a day per degree for snow at sites without glaciers. INFERRED: 4]
        daily_spread_k: 5.0                    # the days of a month scatter around its mean by this much (one standard deviation), so
                                               #  a month just below freezing melts on its warmer days [UNVERIFIED: about the 5 K that
                                               #  Reeh 1991 took for Greenland, as I recall; build step 6]
        ice_after_years: 1.0                   # where more snow falls in a year than the year can melt, the store holds this many
                                               # years of the net snowfall and what is older leaves as ice [INFERRED: a stand-in
                                               #  for snow turning to glacier ice and flowing away. The ice that leaves is the year's
                                               #  net snowfall whatever this number is. The number sets how much snow is left at the
                                               #  end of summer where a year just fails to melt its snow, and so how white that
                                               #  ground is: it moves the edge of the ground that stays white. MEASURED: see
                                               #  docs/BUILD_NOTES.md. The design set a limit on depth instead: with that, the store
                                               #  jumped by the whole limit when a cell tipped from losing its snow to keeping it,
                                               #  and each such cell cost the climate rounds two or three more rounds, MEASURED]
        full_cover_mm: 15.0                    # the ground counts as fully covered while the snow store holds this much water or more,
                                               # and as covered in proportion below that: Albedo draws it white by that share, and
                                               # the ground under snow gives the air nothing
                                               # [DOCUMENTED: Dutra et al. 2010, eq. A2, the older ECMWF rule: cover = min(1, S / 15), S in kg/m2]
      demand:
        priestley_taylor_extra: 0.26           # [DOCUMENTED: Davis et al. 2017, eq. 22: Ep = (1 + w) Eq with w = 0.26. The paper's Eq
                                               #  is that of the hours in which the ground gains energy; the engine's is that of the
                                               #  whole day: library/evaporation.py]
        sunshine_fraction: 0.62                # share of the possible hours of sunshine, the same for every cell and month
                                               # [INFERRED: the engine has no clouds to give it. With 0.62 the two formulas below
                                               #  return the means of Earth's WHOLE surface, land and sea: 0.465 of the sunlight
                                               #  at the top of the air absorbed at the surface, against 161.2 of 341.3 W/m2 = 0.472,
                                               #  and a net loss of heat of 64.0 W/m2 at 15 C, against 396 up less 333 back = 63.
                                               #  DOCUMENTED: Trenberth, Fasullo and Kiehl 2009, Table 2b, the row of the globe.
                                               #  The formulas are used on land. The same table's row of the land: 184.7 W/m2 of
                                               #  sunlight reach the ground, 145.1 are absorbed, and 79.6 are lost as heat.
                                               #  MEASURED under Earth's land temperatures (python tools/earth_demand.py): the
                                               #  formulas give 185.7, 154.1 and 68.3. The sunlight at the ground is the budget's;
                                               #  the budget's land reflects 0.21 of it where the paper's ground reflects 0.17; and
                                               #  the loss of heat is 14 % too small. The share enters both formulas and no single
                                               #  share returns both numbers: the sunlight wants 0.61 and the loss of heat 0.76.
                                               #  The energy left to the land is 85.8 W/m2 where the budget has 65.5. The budget is
                                               #  a published synthesis, not a measurement, and one number for all land: it cannot
                                               #  say which constant is at fault. The constant b below is the paper's and is left
                                               #  as published]
        sunlight:                              # what reaches the ground = (c + d sunshine)(1 + 2.67e-5 height) of the sunlight at
          through_overcast: 0.25               # the top of the air, and the ground reflects 0.17 of it
          through_gain_with_sunshine: 0.50     # [DOCUMENTED: Davis et al. 2017, eqs. 10 to 12: c = 0.25, d = 0.50, albedo 0.17]
          through_gain_per_m: 2.67e-5
          ground_reflects: 0.17
          water_reflects: 0.07                 # open water of a lake reflects less than ground, so it takes up more energy
                                               # [UNVERIFIED: the usual value for water under a high sun, the one Albedo's table
                                               #  gives the sea. INFERRED: using the paper's formula with it for a lake]
        longwave:                              # heat radiated away less what the air sends back = (b + (1 - b) sunshine)(A - T)
          a_c: 107.0                           # [DOCUMENTED: Davis et al. 2017, eq. 13: A = 107, b = 0.20, T in degrees C]
          b: 0.20
        vapour: {factor_pa_c: 2.503e+6, exponent: 17.27, offset_c: 237.3}    # slope of saturation vapour pressure [DOCUMENTED: eq. B1]
        heat: {factor_j_kg: 1.91846e+6, offset_k: 33.91}                     # heat of vaporisation: the factor times the square of
                                               # T / (T - offset), T in kelvin [DOCUMENTED: the SPLASH code as two published
                                               #  repositories carry it, geco-bern/rsofun (src/waterbal_splash.mod.f90, function
                                               #  calc_enthalpy_vap: "1.91846e6*((tc + 273.15)/(tc + 273.15 - 33.91))**2", after
                                               #  "Eq. 8, Henderson-Sellers (1984)") and dsval/rsplash (src/EVAP.cpp). The paper's
                                               #  eq. B2 is the same formula; the text layer of its PDF runs the exponent into the
                                               #  number, "33.912", which an earlier version of this file copied. A test checks
                                               #  the 2.45 MJ/kg at 20 C that FAO paper 56 gives]
        air:                                   # air pressure with height, and the psychrometric constant [DOCUMENTED: eqs. 20 and B8]
          sea_level_pressure_pa: 101325.0
          sea_level_temperature_k: 288.15
          lapse_k_per_m: 0.0065
          lowest_share: 0.01                   # the formula ends where 1 - lapse * height / temperature reaches zero, 44 km up;
                                               # it is held at this share above that [INFERRED]
          molar_mass_air_kg: 0.028963
          molar_mass_water_kg: 0.01802
          gas_constant_j_mol_k: 8.31447
          specific_heat_air_j_kg_k: 1004.6     # [UNVERIFIED: the usual value for dry air; the paper computes it from temperature]
      soil:
        critical_share: 0.75                   # the air gets its full demand while the soil holds more than this share of its
                                               # capacity [DOCUMENTED: the description of the GFDL model: "a critical value that is
                                               #  75 percent of field capacity"]
        years_most: 60                         # years followed at most before the store must repeat
        repeat_within_mm: 0.01                 # the year repeats when the store at its end is this close to the store at its start
    expected_range:
      surface_gravity_m_s2: [5.0, 20.0]

  Soils:
    # The first version, one capacity everywhere, is still there: worldengine.processes.soils_uniform:UniformSoil
    implementation: worldengine.processes.soils_jenny_rules:JennyRuleSoils
    standing: Rule
    model: "Soil depth from production that slows as the soil thickens (Heimsath et al. 1997), against erosion and the time since the ground was renewed; the order from a rule table over Jenny's five factors onto the USDA orders; water held and fertility from depth, rock and order."
    ignores: "Everything finer than an order, farming, soil laid down by rivers, wind and ice."
    wrong_where: "A classification, not a physical model; boundaries are sharper than in nature; surface ages count from the start of the history. The thresholds of the table are not tested against a soil map: the reference data hold none. [INFERRED]"
    writes: [soil_order, soil_depth, soil_water_capacity, soil_fertility]
    constants:
      wet_without_demand: 10.0                 # rain over demand where the air asks for nothing [INFERRED]
      depth:
        fastest_production_m_per_year: 7.7e-5  # P0 [UNVERIFIED: recalled from Heimsath et al. 1997, 77 mm per thousand years]
        decline_depth_m: 0.5                   # h0, the depth over which production falls by e [UNVERIFIED: recalled from the same]
        production_from_c: -5.0                # production grows with warmth from here ... [PROVISIONAL]
        production_full_at_c: 25.0             # ... to here, and with rain over demand up to 1 [PROVISIONAL]
        usual_warmth_and_water: 0.25           # warmth times water (each 0 to 1) at which production is P0 [PROVISIONAL: with 0.5 and a
                                               #  ceiling of 2, 0.38 of the default world's land was bare rock; with these two, 0.26]
        least_production_share: 0.1            # cold or dry ground still weathers at this share of P0 [PROVISIONAL]
        most_production_share: 4.0             # hot, wet ground weathers at up to this share of P0 [PROVISIONAL]
        deepest_m: 20.0
        least_time_my: 1.0                     # ground renewed in the last round has weathered about half of it [INFERRED: a round is 2 My]
      root_depth_m: 1.5                        # the water below this is out of reach [UNVERIFIED: a common rooting depth]
      least_capacity_mm: 10.0                  # bare rock and thin soil still hold this much in cracks [PROVISIONAL]
      water_per_metre_mm:                      # water held for plants per metre of soil, by the rock below [PROVISIONAL]
        default: 150.0
        rift_basin: 180.0
        volcanic_arc: 170.0
        old_mountain_roots: 110.0
        young_fold_belt: 120.0
      orders:                                  # in order; the first that matches wins [PROVISIONAL: thresholds mine, after the orders' definitions]
        - {order: ice, where: {lasting_ice: [0.99, null]}}
        - {order: bare_rock, where: {depth_m: [null, 0.1]}}
        - {order: shifting_sand, where: {wet: [null, 0.1], plants: [null, 0.1]}}
        - {order: gelisols, where: {permafrost: [0.5, null]}}
        - {order: histosols, where: {wet: [2.0, null], mean_temperature_c: [null, 5.0], slope: [null, 0.002]}}
        - {order: andisols, rock: [volcanic_arc], where: {age_my: [null, 50.0]}}
        - {order: oxisols, where: {mean_temperature_c: [22.0, null], wet: [1.2, null], age_my: [50.0, null]}}
        - {order: ultisols, where: {mean_temperature_c: [15.0, null], wet: [1.0, null], age_my: [20.0, null]}}
        - {order: vertisols, rock: [rift_basin], where: {wet: [0.5, 1.2], mean_temperature_c: [15.0, null]}}
        - {order: aridisols, where: {wet: [null, 0.5]}}
        - {order: mollisols, biome: [warm_grass_shrub, cool_grass_shrub, xerophytic_woods_scrub], where: {wet: [0.5, 1.2]}}
        - {order: spodosols, biome: [taiga, cool_conifer_forest, cool_mixed_forest, cold_mixed_forest], where: {wet: [1.0, null]}}
        - {order: alfisols, where: {mean_temperature_c: [5.0, 22.0], wet: [0.8, 2.0], age_my: [5.0, null]}}
        - {order: inceptisols, where: {age_my: [null, 5.0]}}
        - {order: inceptisols, where: {slope: [0.01, null]}}
        - {order: entisols}
      fertility:                               # the share of the richest soil's nutrients, by order [PROVISIONAL]
        mollisols: 0.9
        andisols: 0.8
        alfisols: 0.75
        vertisols: 0.7
        inceptisols: 0.6
        histosols: 0.5
        entisols: 0.45
        aridisols: 0.4
        gelisols: 0.3
        ultisols: 0.3
        spodosols: 0.25
        oxisols: 0.2

  Biomes:
    # The first version, Whittaker's chart, is still there: worldengine.processes.biomes_whittaker_koppen:WhittakerKoppen
    implementation: worldengine.processes.biomes_biome1:Biome1
    standing: Established
    model: "BIOME1 of Prentice et al. 1992: plant functional types admitted by the coldest and warmest months, growing degree-days and a drought index; the dominant ones name the biome. The Köppen-Geiger class of Peel, Finlayson and McMahon 2007 alongside."
    ignores: "Fire, grazing, competition over time, the level of carbon dioxide."
    wrong_where: "The edges of savanna and grassland that fire sets; degree-days from monthly means fall short where months straddle the base. [INFERRED]"
    writes: [climate_class, biome, vegetation_cover]
    constants:
      plant_types: {from_file: {file: biomes, key: plant_types}}
      biomes: {from_file: {file: biomes, key: biome1}}
      without_plants:                          # the engine's own classes, outside the table
        - {name: ocean, cover: 0.0}
        - {name: ice, cover: 0.0}
      gdd_bases_c: {gdd5: 5.0, gdd0: 0.0}
      supply_mm_per_day: 5.0                   # the most the soil can give the air, times its relative moisture [UNVERIFIED: recalled]
      lasting_ice_cover: 0.99                  # land covered by ice in every month at least this much is ice
      sea_ice_biome_above: 0.5                 # sea under ice for more than this share of the year is shown as ice
      growth_from_c: 0.0                       # the plant cover of a seasonal biome is least below this ... [PROVISIONAL]
      full_growth_at_c: 10.0                   # ... and full above this [PROVISIONAL]
      dormant_share: 0.2                       # the share of its cover a seasonal biome keeps in the cold months [PROVISIONAL]
      poor_soil_effect: 0.3                    # cover on the poorest soil is this share less than on the richest [PROVISIONAL]
      limited_by_cold: [tundra, polar_desert, ice]
      limited_by_dryness: [hot_desert, semi_desert, warm_grass_shrub, xerophytic_woods_scrub]
      koppen:                                  # [DOCUMENTED: Peel, Finlayson and McMahon 2007, Table 1; temperatures in C, precipitation in mm]
        months: 12
        summer_months_north: [4, 5, 6, 7, 8, 9]    # summer is the warmer of April-September and October-March
        arid_per_degree_mm: 2.0                # threshold = 2 * mean yearly temperature ...
        arid_summer_rain_mm: 28.0              # ... + 28 if 70 % of the rain falls in summer
        arid_even_rain_mm: 14.0                # ... + 14 otherwise, and + 0 if 70 % falls in winter
        season_share: 0.7
        arid_factor: 10.0                      # arid (B) if yearly precipitation < 10 * threshold
        desert_factor: 5.0                     # desert (BW) if < 5 * threshold, else steppe (BS)
        arid_hot_c: 18.0
        tropical_coldest_c: 18.0
        rainforest_driest_mm: 60.0
        monsoon_base_mm: 100.0
        monsoon_divisor: 25.0
        warm_month_c: 10.0
        cold_coldest_c: 0.0                    # temperate above, cold at or below; the paper uses 0 and not -3
        dry_summer_mm: 40.0
        dry_summer_ratio: 3.0
        dry_winter_ratio: 10.0
        hot_summer_c: 22.0
        warm_summer_months: 4
        severe_winter_c: -38.0
        frost_warmest_c: 0.0

  StormClimatology:
    implementation: worldengine.processes.storm_climatology:StormMaps
    standing: Adapted
    model: "Mid-latitude storm tracks as the storm growth rate (Eady) carried downwind by the steering wind and fading over a storm's life; the genesis potential index of tropical cyclones of Emanuel and Nolan, as in Camargo et al. 2007, with potential intensity from the sea's temperature after DeMaria and Kaplan 1994."
    ignores: "Thunderstorms, storms acting on each other, and the heights at which the published index reads its terms."
    wrong_where: "Counts of storms: read the maps as where and when, not how many. The humidity and the shear of the index come from a one-layer air and stand in for those at their heights. [INFERRED]"
    writes: [storm_track_density, tc_genesis_potential, potential_intensity]
    constants:
      storm_life_days: 4.0                     # what a storm's growth carries fades over this time [UNVERIFIED: mid-latitude storms
                                               #  live a few days]
      saturation:                              # Moisture's numbers: the formula of Bolton 1980 [UNVERIFIED, as recalled there]
        pressure_at_zero_pa: 611.2
        exponent_factor: 17.67
        exponent_offset_k: 29.65
        vapour_gas_constant_j_kg_k: 461.5
        lowest_temperature_k: 150.0
      vapour_scale_height_m: 2500.0            # as Moisture's: turns what air can hold at the surface into what a column can hold
      intensity_a_m_s: 28.2                    # potential intensity = A + B exp(C (T - T0)), T the sea's temperature in C
      intensity_b_m_s: 55.8                    #  [UNVERIFIED: the form and the four numbers are recalled from DeMaria and Kaplan
      intensity_c_per_k: 0.1813                #  1994, a fit over the Atlantic]
      intensity_t0_c: 30.0
      warm_enough_c: 20.0                      # below this the relation is not used and the intensity is zero [PROVISIONAL]
      intensity_cap_m_s: 90.0                  # [PROVISIONAL: about the strongest winds measured in cyclones, UNVERIFIED]
      gpi:                                     # |1e5 eta|^1.5 (H/50)^3 (V/70)^3 (1 + 0.1 S)^-2 [UNVERIFIED: recalled, Emanuel and Nolan 2004]
        vorticity_scale: 1.0e+5
        vorticity_power: 1.5
        humidity_ref: 50.0
        humidity_power: 3.0
        intensity_ref: 70.0
        intensity_power: 3.0
        shear_factor: 0.1
        shear_power: -2.0

  WeatherStatistics:
    implementation: worldengine.processes.weather_statistics:MixingLengthWeather
    standing: Assembled
    model: "How far a day's temperature strays: the temperature contrast across a mixing length of about 900 km (Schneider, Bischoff and Plotka 2015). The share of wet days from the month's rain to the power 0.45 (New, Hulme and Jones 2000)."
    ignores: "The difference between day and night; spells held in place when storm tracks stall; swings caused by cloud or thunderstorms."
    wrong_where: "The spread is too small in the tropics and wherever swings come from cloud or thunderstorms. One scale for the whole planet cannot tell a drizzle climate from one of rare downpours. Neither field is tested against daily data for Earth: the reference data hold none. [INFERRED]"
    writes: [daily_temperature_spread, wet_day_fraction]
    constants:
      mixing_length_km: 900.0                  # [DOCUMENTED in the design: Schneider, Bischoff and Plotka 2015, near the surface in
                                               #  mid-latitudes]
      dense_tracks_percentile: 90.0            # the track density counted as dense, in each month [PROVISIONAL]
      thin_track_share: 0.3                    # where storm tracks are thin the length shrinks to this share [PROVISIONAL]
      sea_damping: 0.5                         # the sea's heat damps the day-to-day spread by this share [PROVISIONAL]
      wet_day_scale: 0.3                       # wet-day share at 1 mm of rain a day [PROVISIONAL: one scale for the whole planet]
      wet_day_power: 0.45                      # [DOCUMENTED in the design: New, Hulme and Jones 2000, equation 4]

  SynopticStorms:
    implementation: worldengine.processes.synoptic_storms:StormTracks
    standing: Adapted
    model: "Storms born at random where the storm maps are high, each keyed by its birth date; mid-latitude storms carried by the steering wind, tropical cyclones by the steering wind and a drift toward the pole and the west (beta-and-advection, Emanuel et al. 2006)."
    ignores: "Storms acting on each other, and weather fronts."
    wrong_where: "Each path is a plausible sample, not a prediction; the numbers born are set here, not drawn from the maps, which are not counts. [INFERRED]"
    writes: [storm_influence, "table:storms"]
    constants:
      midlatitude_births_per_day: 6.0          # over the whole planet [PROVISIONAL: UNVERIFIED for Earth]
      tropical_births_per_day: 0.25            # about 90 a year [UNVERIFIED: the order of Earth's yearly count of tropical cyclones]
      beta_drift_m_s: 2.0                      # [UNVERIFIED: a few metres a second, recalled]
      beta_poleward_share: 0.5                 # the drift heads as much toward the pole as toward the west [INFERRED]
      tropical_needs_sea_c: 26.0               # a tropical cyclone holds its strength only over sea at least this warm [UNVERIFIED:
                                               #  the usual threshold, recalled]
      tropical_daily_decay: 0.5                # off warm sea it keeps this share of its strength each day [PROVISIONAL]
      tropical_reference_intensity_m_s: 70.0   # strength 1 at this potential intensity: the reference of the genesis index
      midlatitude_radius_km: 1000.0            # the reach of a storm's influence [INFERRED: the synoptic scale]
      tropical_radius_km: 300.0                # [INFERRED: the order of a cyclone's rain shield]
      influence_cap: 2.0                       # overlapping storms add up to no more than this

  DailyWeather:
    implementation: worldengine.processes.daily_weather:RemembersNoiseWeather
    standing: Adapted
    model: "A weather generator in the line of Richardson 1981: temperatures drawn around the monthly mean with WeatherStatistics' spread, wet days at its share with exponential amounts that keep the month's total, wind and pressure around the monthly means; spells come from noise remembered over the look-back window, and passing storms bring rain and low pressure."
    ignores: "The motion of the air itself."
    wrong_where: "The weakest causal link in the chain: a believable sample around a physically derived climate, not a simulation. Years differ too little from each other. [INFERRED]"
    writes: [weather_temperature, weather_precipitation, weather_wind, weather_pressure]
    constants:
      noise_length_km: 800.0                   # neighbouring cells vary together over about this distance [PROVISIONAL: weather
                                               #  systems span about a thousand kilometres]
      persistence: 0.7                         # the weight of yesterday's noise against today's [PROVISIONAL: spells of a few days]
      storm_rain_chance: 0.6                   # a storm at full strength makes rain this likely where it is [PROVISIONAL]
      pressure_spread_pa_per_k: 150.0          # pressure falls this much on a day one kelvin warmer than usual [PROVISIONAL]
      storm_low_pa: 2000.0                     # a storm at full strength lowers the pressure by this [UNVERIFIED: 20 hPa, the order of
                                               #  a mid-latitude low]
      wind_spread_m_s: 3.0                     # the day's wind strays from the month's by about this [PROVISIONAL]
