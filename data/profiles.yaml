# Profiles (design, Layer 1 and Layer 3). Mesh level, the cap on climate rounds, blending and stopping tolerances.
# The tolerances below are first values, set before any Earth test; from the first measured run on they are only tightened.
profiles:
  preview:
    mesh_level: 5                  # 10,242 cells, about 240 km apart
    math_threads: 1
    run_time_limit_s: 120
    climate: &climate
      max_rounds: 60
      blend_weight: 0.7            # new = old + w * (computed - old) for values read from the previous round
      cell_share: 0.01             # share of the area allowed above a field's per-cell tolerance
      class_change_share: 0.002    # share of the area allowed to change class between rounds
      default_tolerance: {mean: 0.01, cell: 0.2}
    climate_rerun_every_rounds: null
    snapshot_every_rounds: 5
    snapshot_fields: [elevation, ocean_mask, plate_id, crust_type]
  standard:
    mesh_level: 7                  # 163,842 cells, about 60 km apart
    math_threads: 1
    run_time_limit_s: 1800
    climate: *climate
    climate_rerun_every_rounds: null
    snapshot_every_rounds: 5
    snapshot_fields: [elevation, ocean_mask, plate_id, crust_type]
  high_fidelity:
    mesh_level: 8                  # 655,362 cells, about 30 km apart, if build step 9 shows it fits
    math_threads: 1
    run_time_limit_s: 28800
    climate: *climate
    climate_rerun_every_rounds: null   # the rerun of the climate inside the history is built in step 9
    snapshot_every_rounds: 5
    snapshot_fields: [elevation, ocean_mask, plate_id, crust_type]
